function mistakeList(){
 const d=S.data, byLesson={};
 (d.reviewEvents||[]).forEach(e=>{
  if(e.correct===1) return;
  byLesson[e.lesson_id]=byLesson[e.lesson_id]||{lesson_id:e.lesson_id,count:0,last:e.reviewed_at};
  byLesson[e.lesson_id].count++;
  if(e.reviewed_at>byLesson[e.lesson_id].last) byLesson[e.lesson_id].last=e.reviewed_at;
 });
 (d.writingEvents||[]).forEach(e=>{
  if(e.ok===1||!e.lesson_id) return;
  byLesson[e.lesson_id]=byLesson[e.lesson_id]||{lesson_id:e.lesson_id,count:0,last:e.at,writing:0};
  byLesson[e.lesson_id].writing=(byLesson[e.lesson_id].writing||0)+1;
 });
 return Object.values(byLesson).sort((a,b)=>b.count-a.count);
}

function clamp(n,a,b){ return Math.max(a,Math.min(b,n)); }
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function foldVi(s){ return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d'); }
function escRe(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }

function customWords(){ return (S.data.customWords||[]).map(w=>({id:w.id,en:w.en,ipa:'',pos:'',vi:w.vi||'',exEn:w.exEn||'',exVi:w.exVi||'',topic:'mine',level:1,custom:true})); }
function allWords(){ return customWords().concat(WORDS); }
function wordById(id){ return WORD_MAP.get(id) || customWords().find(w=>w.id===id) || null; }
function sentenceById(id){ return SENT_MAP.get(id)||null; }
function wordStatus(id){ const c=(S.data.wordCards||{})[id]; if(!c) return 'new'; if(c.known) return 'known'; if(c.box>=4) return 'mastered'; return 'learning'; }
function matchStatus(id,st){ const c=(S.data.wordCards||{})[id]; if(st==='wrong') return !!(c&&c.wrong>0&&c.box<4&&!c.known); return wordStatus(id)===st; }
function filterWords(f){
 const q=foldVi(f.q||'').trim();
 return allWords().filter(x=>(f.topic==='all'||x.topic===f.topic)&&(!Number(f.level)||x.level===Number(f.level))&&(!f.status||f.status==='all'||matchStatus(x.id,f.status))
  &&(!q||foldVi(x.en).includes(q)||foldVi(x.vi).includes(q)));
}
function topicProgress(){

 allWords().forEach(w=>{ const r=res[w.topic]||(res[w.topic]={total:0,learned:0}); r.total++; const c=wc[w.id]; if(c&&(c.box>=1||c.known)) r.learned++; });
 return res;

function vocabSettings(){
 const d=S.data;
 d.vocabSettings=Object.assign({newPerDay:8,newSentences:2,maxReviews:40,topics:TOPICS.filter(t=>t.id!=='mine').map(t=>t.id),pinned:[]}, d.vocabSettings||{});
 const st=d.vocabSettings;
 if(!Array.isArray(st.topics)||!st.topics.length) st.topics=TOPICS.filter(t=>t.id!=='mine').map(t=>t.id);
 if(!Array.isArray(st.pinned)) st.pinned=[];
 // Bản cũ chưa có 4 chủ đề mới → tự thêm vào để phiên học lấy được từ mới
 if((st.topicsV||1)<2){
  ['numbers','time','sales','workplace'].forEach(t=>{ if(!st.topics.includes(t)) st.topics.push(t); });

/* Thứ tự học từ mới: hết cấp 1 mới sang cấp 2; trong mỗi cấp xen kẽ các chủ đề (chủ đề nền tảng được ưu tiên ở cấp 1) */
let _wordOrderCache=null, _sentOrderCache=null;
function roundRobin(items,topics,weightFn){
 const out=[];
 [1,2,3].forEach(lv=>{
  const groups=topics.map(t=>items.filter(x=>x.topic===t&&x.level===lv)); const ptr=groups.map(()=>0); let added=true;
  while(added){ added=false; groups.forEach((g,gi)=>{ const take=weightFn?weightFn(topics[gi],lv):1; for(let k=0;k<take&&ptr[gi]<g.length;k++){ out.push(g[ptr[gi]++]); added=true; } }); }
 });
 return out;
}
function wordOrder(topics){ const key=topics.join(','); if(!_wordOrderCache||_wordOrderCache.key!==key) _wordOrderCache={key,list:roundRobin(WORDS,topics,(t,lv)=>lv!==1?1:t==='core'?3:(t==='numbers'||t==='time')?2:1)}; return _wordOrderCache.list; }
function sentenceOrder(topics){ const key=topics.join(','); if(!_sentOrderCache||_sentOrderCache.key!==key) _sentOrderCache={key,list:roundRobin(SENTENCES,topics.concat(['core']).filter((t,i,a)=>a.indexOf(t)===i))}; return _sentOrderCache.list; }
function nextNewWords(n,exclude){
 const st=vocabSettings(), cards=S.data.wordCards||{}, out=[], seen=new Set(exclude||[]);
 const push=w=>{ if(out.length<n && w && !cards[w.id] && !seen.has(w.id)){ out.push(w); seen.add(w.id); } };
 (st.pinned||[]).forEach(id=>push(wordById(id)));
 customWords().forEach(push);
 const order=wordOrder(st.topics);
 for(let i=0;i<order.length&&out.length<n;i++) push(order[i]);
 return out;
}
function nextNewSentences(n){
 const st=vocabSettings(), cards=S.data.sentCards||{}, out=[]; const order=sentenceOrder(st.topics);
 for(let i=0;i<order.length&&out.length<n;i++) if(!cards[order[i].id]) out.push(order[i]);
 return out;
}
function clozeFor(w){
 if(!w||!w.exEn||!w.en||w.en.includes('/')) return null;
 const base=w.en.trim(); const re=new RegExp('(^|[^A-Za-z])('+escRe(base)+'(?:s|es|ed|d|ing)?)(?![A-Za-z])','i');
 const m=re.exec(w.exEn); if(!m) return null;
 const start=m.index+m[1].length;
 return {before:w.exEn.slice(0,start),form:m[2],after:w.exEn.slice(start+m[2].length)};
}
function drillForWordCard(c,w){
 if(c.box<=1) return 'meaning';
 if(c.box<=3) return Speech.supported?'dictation':'meaning';
 return (clozeFor(w)&&c.seen%2===0)?'cloze':(Speech.supported?'dictation':'meaning');
}
function drillForSentCard(c){ if(c.box<=3) return Speech.supported?'dictation':'copy'; return 'translate'; }
function scheduleCard(kind,id,result){
 const key=kind==='s'?'sentCards':'wordCards'; S.data[key]=S.data[key]||{};
 const today=localDay(); const c=Object.assign({box:0,right:0,wrong:0,seen:0,first:today}, S.data[key][id]||{});
 c.seen++; c.last=today; delete c.known;
 if(result==='ok'){ c.right++; c.box=Math.min(c.box+1,WORD_INTERVALS.length-1); c.due=addDays(WORD_INTERVALS[c.box]); }
 else if(result==='hint'){ c.right++; c.box=Math.max(c.box,1); c.due=addDays(1); }
 else { c.wrong++; c.lastWrong=today; c.box=c.box>=3?2:0; c.due=addDays(1); }
 S.data[key][id]=c;
 if(kind==='w'){ const st=vocabSettings(); st.pinned=(st.pinned||[]).filter(x=>x!==id); }
}
function buildVocabDaily(){
 const st=vocabSettings(), today=localDay(), wc=S.data.wordCards||{}, sc=S.data.sentCards||{};
 const due=Object.keys(wc).filter(id=>wc[id].due<=today && wordById(id))
  .sort((a,b)=>wc[a].due.localeCompare(wc[b].due)||(wc[a].box-wc[b].box)).slice(0,st.maxReviews);
 const fresh=nextNewWords(st.newPerDay);
 const items=[];
 fresh.forEach(w=>items.push({k:'w',id:w.id,drill:'trace',intro:true}));
 shuffle(due).forEach(id=>items.push({k:'w',id,drill:drillForWordCard(wc[id],wordById(id))}));
 shuffle(fresh).forEach(w=>items.push({k:'w',id:w.id,drill:'meaning',isNew:true}));
 Object.keys(sc).filter(id=>sc[id].due<=today&&sentenceById(id)).slice(0,8).forEach(id=>items.push({k:'s',id,drill:drillForSentCard(sc[id])}));
 nextNewSentences(st.newSentences).forEach(s=>items.push({k:'s',id:s.id,drill:'copy',isNew:true}));
 return {date:today,items:items.map(x=>Object.assign(x,{res:null})),idx:0,started:false};
}
function todayVocab(){ const v=S.data.vocabDaily; if(v&&v.date===localDay()) return v; return buildVocabDaily(); }
function writingStreak(){
 const days=new Set((S.data.writingEvents||[]).map(e=>localDay(new Date(e.at))));
 let n=0, i=days.has(localDay())?0:1;
 while(days.has(addDays(-i))){ n++; i++; }
 return n;
}
function vocabStats(){
 const wc=S.data.wordCards||{}, ids=Object.keys(wc), today=localDay();
 return {total:allWords().length, learned:ids.filter(id=>wc[id].box>=1||wc[id].known).length, mastered:ids.filter(id=>wc[id].box>=4).length,
  due:ids.filter(id=>wc[id].due<=today).length, weak:ids.filter(id=>wc[id].wrong>0&&wc[id].box<4&&!wc[id].known).length, streak:writingStreak()};
}
function parseCustomWords(text){
 const existing=new Set((S.data.customWords||[]).map(w=>w.en.toLowerCase())); const out=[];
 String(text||'').split(/\r?\n/).forEach(line=>{
  let parts;
  if(line.includes('|')) parts=line.split('|'); else if(line.includes('\t')) parts=line.split('\t'); else if(line.includes(' - ')) parts=line.split(' - '); else if(line.includes(':')) parts=line.split(':'); else return;
  parts=parts.map(x=>x.trim()); const [en,vi,exEn,exVi]=parts;
  if(!en||!vi||en.length>60) return; const key=en.toLowerCase(); if(existing.has(key)) return; existing.add(key);
  out.push({id:'u-'+uid().slice(0,8),en,vi,exEn:exEn||'',exVi:exVi||'',added:localDay()});
 });
 return out;
}

/* ---------------- chấm bài: so từng chữ cái (từ) hoặc từng từ (câu) ---------------- */
function normText(s){
 return String(s||'').replace(/[’‘`´]/g,"'").replace(/[“”]/g,'"').toLowerCase()
  .replace(/[.,!?;:"()\[\]…]/g,' ').replace(/(^|\s)'+|'+(?=\s|$)/g,' ').replace(/\s+/g,' ').trim();
}
function lcsOps(A,B){
 const n=A.length,m=B.length; const dp=[]; for(let i=0;i<=n;i++) dp.push(new Uint16Array(m+1));
 for(let i=n-1;i>=0;i--) for(let j=m-1;j>=0;j--) dp[i][j]=A[i]===B[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
 const ops=[]; let i=0,j=0;
 while(i<n&&j<m){ if(A[i]===B[j]){ ops.push(['=',A[i]]); i++; j++; } else if(dp[i+1][j]>=dp[i][j+1]){ ops.push(['-',A[i]]); i++; } else { ops.push(['+',B[j]]); j++; } }
 while(i<n) ops.push(['-',A[i++]]); while(j<m) ops.push(['+',B[j++]]);
 return {ops,common:dp[0][0]};
}
function gradeAnswer(target,typed,unit){
 const b=normText(typed);
 if(!b) return {ok:false,score:0,ops:[],unit};
 const alts=String(target).split(/\s+\/\s+/); let best=null;
 alts.forEach(t=>{
  const a=normText(t); const A=unit==='char'?[...a]:a.split(' '), B=unit==='char'?[...b]:b.split(' ');
  const r=lcsOps(A,B); const g={ok:a===b,score:Math.round(r.common/Math.max(A.length,B.length)*100),ops:r.ops,unit};
  if(!best||g.ok||(!best.ok&&g.score>best.score)) best=best&&best.ok?best:g;
 });
 return best;
}
function diffHtml(g){
 const sep=g.unit==='char'?'':' ';
 const show=t=>esc(t===' '?'␣':t);
 const tgt=g.ops.filter(o=>o[0]!=='+').map(o=>o[0]==='='?`<span class="diff-ok">${show(o[1])}</span>`:`<span class="diff-miss">${show(o[1])}</span>`).join(sep);
 const you=g.ops.filter(o=>o[0]!=='-').map(o=>o[0]==='='?`<span>${show(o[1])}</span>`:`<span class="diff-bad">${show(o[1])}</span>`).join(sep);
 return `<div class="diff-line"><small class="muted">Mẫu đúng — chỗ tô cam là ${g.unit==='char'?'chữ cái':'từ'} anh thiếu hoặc viết khác:</small><div class="diff-text">${tgt}</div></div>
 <div class="diff-line"><small class="muted">Anh viết — chỗ tô đỏ là phần thừa hoặc sai:</small><div class="diff-text">${you||'—'}</div></div>`;
}
function hintPattern(t){ return String(t).split(' ').map(wd=>wd.split('').map((ch,i)=>i===0||!/[a-z]/i.test(ch)?ch:'_').join(' ')).join('   '); }
function recordWriting(P,d){
 const ev={id:uid(),mode:(P.session?'daily-':'')+(P.k==='s'?'sentence':'word'),item_id:P.id,drill:P.drill,lesson_id:P.lessonId||'',

   const r=d.graded.ok?(d.hint?'hint':'ok'):'bad'; it.res=r;
   if(!it.retry){ scheduleCard(it.k,it.id,r); if(r==='bad') v.items.push({k:it.k,id:it.id,drill:it.drill,retry:true,res:null}); }
  } else it.res='skip';

}

 <p class="muted">${WORDS.length} từ về kinh tế, kinh doanh, chính trị, thế giới, số đếm và ngày tháng · ${SENTENCES.length} câu mẫu từ dễ đến khó. Viết bằng Apple Pencil, em chấm đến từng chữ cái.</p></div></div>
 <div class="tabs">${tabs.map(([id,l])=>`<button class="tab ${st.tab===id?'active':''}" data-act="studytab" data-id="${id}">${l}</button>`).join('')}</div>${body}`;
}
function speakBtns(){ return Speech.supported?`<button class="btn outline" data-act="speakcur">🔊 Nghe</button><button class="btn outline" data-act="speakcurslow">🐢 Nghe chậm</button>`:''; }
function renderPracticeBody(P){
 const d=ensureDraft(P);
 const show=!P.hidden||d.stage==='graded'||d.revealed;
 d.ghostText=show?P.target:''; if(!show) d.ghostOn=false;
 d.speakText=P.speak;
 return (P.k==='w'?renderWordPrompt(P,d,show):renderSentencePrompt(P,d,show))+renderInkPanel(P,d,show)+renderAnswerPanel(P,d);
}
function promptHead(P){
 const topic=TOPIC_BY_ID[(P.word||P.sent).topic];
 return `<p class="eyebrow">${topic?esc(topic.icon+' '+topic.name.toUpperCase())+' · ':''}${esc(DRILL_INFO[P.drill].label.toUpperCase())}</p><p class="muted" style="font-size:13px">${esc(DRILL_INFO[P.drill].how)}</p>`;
}
function renderWordPrompt(P,d,show){
 const w=P.word; let main='';
 if(!show&&P.drill==='meaning'){
  main=`<p class="muted">Viết từ tiếng Anh có nghĩa là:</p><div class="word-hero vi">${esc(w.vi)}</div>${w.pos?`<div class="word-meta"><span class="pos-tag">${esc(POS_VI[w.pos]||w.pos)}</span></div>`:''}
  ${d.hint?`<div class="hint-pattern">${esc(hintPattern(P.target))}</div>`:''}`;
 } else if(!show&&P.drill==='dictation'){
  main=`<div class="big-listen"><button class="btn big" data-act="speakcur">🔊 Nghe từ</button><button class="btn outline big" data-act="speakcurslow">🐢 Nghe chậm</button></div>
  ${d.hint?`<p class="muted">Gợi ý nghĩa: ${esc(w.vi)}</p><div class="hint-pattern">${esc(hintPattern(P.target))}</div>`:''}`;
 } else if(!show&&P.drill==='cloze'){
  const cz=clozeFor(w);
  main=`<p class="cloze">${esc(cz.before)}<span class="blank">${'_'.repeat(Math.max(5,cz.form.length))}</span>${esc(cz.after)}</p><p class="muted">${esc(w.exVi)}</p>
  ${d.hint?`<p class="muted">Gợi ý: từ gốc nghĩa là “${esc(w.vi)}” · <span class="hint-pattern">${esc(hintPattern(cz.form))}</span></p>`:''}`;
 } else {
  main=`<div class="word-hero">${esc(w.en)}</div>
  <div class="word-meta">${w.ipa?`<span class="ipa">${esc(w.ipa)}</span>`:''}${w.pos?`<span class="pos-tag">${esc(POS_VI[w.pos]||w.pos)}</span>`:''}${LEVEL_VI[w.level]?`<span class="pos-tag">${LEVEL_VI[w.level]}</span>`:''}</div>
  <p style="font-size:19px;margin-bottom:8px">${esc(w.vi)}</p>
  ${w.exEn?`<p class="example-en">${esc(w.exEn)} ${Speech.supported?'<button class="speak-btn" data-act="speakex">🔊</button>':''}</p>`:''}
  ${w.exVi?`<p class="muted" style="font-size:13px">${esc(w.exVi)}</p>`:''}
  <div class="btn-row" style="margin-top:8px">${speakBtns()}</div>`;
 }
 const hintBtn=!show&&!d.hint?`<button class="btn ghost" data-act="anshint">💡 Gợi ý</button>`:'';
 return `<div class="panel practice" id="practiceTop">${promptHead(P)}${main}${hintBtn}</div>`;
}
function renderSentencePrompt(P,d,show){
 const s=P.sent; let main='';
 if(!show&&P.drill==='dictation'){
  main=`<div class="big-listen"><button class="btn big" data-act="speakcur">🔊 Nghe câu</button><button class="btn outline big" data-act="speakcurslow">🐢 Nghe chậm</button></div>
  ${d.hint?`${s.vi?`<p class="muted">Nghĩa: ${esc(s.vi)}</p>`:''}<div class="hint-pattern small">${esc(hintPattern(s.en))}</div>`:''}`;
 } else if(!show&&P.drill==='translate'){
  main=`<p class="muted">Viết câu này bằng tiếng Anh:</p><p class="sentence-hero vi">${esc(s.vi)}</p>
  ${d.hint?`<div class="hint-pattern small">${esc(hintPattern(s.en))}</div>${s.note?`<p class="grammar-note">📘 ${esc(s.note)}</p>`:''}`:''}`;
 } else {
  main=`<p class="sentence-hero">${esc(s.en)}</p>${s.vi?`<p class="muted">${esc(s.vi)}</p>`:''}${s.note?`<p class="grammar-note">📘 ${esc(s.note)}</p>`:''}
  <div class="btn-row" style="margin-top:8px">${speakBtns()}</div>`;
 }
 const hintBtn=!show&&!d.hint?`<button class="btn ghost" data-act="anshint">💡 Gợi ý</button>`:'';
 return `<div class="panel practice" id="practiceTop">${promptHead(P)}${main}${hintBtn}</div>`;
}

  <div class="seg"><span class="field-help">Độ đậm nét: ${inkPrefs.width}</span><input type="range" min="1" max="10" value="${inkPrefs.width}" data-act="inkwidth" style="width:170px"></div>
  <label class="check-row"><input type="checkbox" data-act="inkpenonly" ${inkPrefs.penOnly?'checked':''}> Chỉ vẽ bằng Apple Pencil — ngón tay và lòng bàn tay chạm vào giấy sẽ không vẽ</label>
  <div class="btn-row"><button class="btn outline sm" data-act="inkexport">🖼 Xuất ảnh PNG</button><button class="btn outline sm" data-act="inksave">💾 Lưu trang viết</button></div>

   <span class="tb-sep"></span>
   ${INK_COLORS.map(c=>`<button class="swatch ${inkPrefs.color===c&&inkPrefs.tool==='pen'?'active':''}" style="background:${c}" data-act="inkcolor" data-id="${c}" aria-label="Màu ${c}"></button>`).join('')}
   <span class="tb-sep"></span>
   <button class="btn outline sm" data-act="inkundo" ${d.undo.length?'':'disabled'} aria-label="Hoàn tác">↶</button>
   <button class="btn outline sm" data-act="inkredo" ${d.redo.length?'':'disabled'} aria-label="Làm lại">↷</button>
   <button class="btn outline sm" data-act="inkclear">🗑 Xóa</button>
   ${show&&P.target?chip('inkghost','','👻 Chữ mờ để tô',d.ghostOn):''}
   ${chip('inkmore','','⚙️ Giấy & bút',S.inkMore)}
  </div>${more}
  <div id="inkWrap" class="ink-canvas-wrap"><canvas id="inkBg"></canvas><canvas id="inkFg" class="ink-layer"></canvas></div>
  <p class="field-help">${inkPrefs.penOnly?'Đang bật “chỉ vẽ bằng bút”: tay chạm vào giấy không vẽ ra nét.':'Viết bằng Apple Pencil hoặc ngón tay.'}${d.autosave?' Trang viết tự lưu trên máy.':''}</p>
 </div>`;

function renderAnswerPanel(P,d){
 const listName=P.k==='s'?'sentence':'word';
 const nav=P.session
  ?`<div class="btn-row"><button class="btn" data-act="vdnext" ${P.drill==='trace'||d.stage==='graded'?'':'disabled'}>Tiếp →</button>${P.drill!=='trace'&&d.stage!=='graded'?`<button class="btn ghost" data-act="vdskip">Bỏ qua</button>`:''}</div>`
  :`<div class="btn-row"><button class="btn outline" data-act="lprev" data-list="${listName}" ${P.listIdx<=0?'disabled':''}>← Trước</button><span class="day-chip">${P.listIdx+1}/${P.listLen}</span><button class="btn" data-act="lnext" data-list="${listName}" ${P.listIdx>=P.listLen-1?'disabled':''}>Sau →</button><button class="btn outline" data-act="lrand" data-list="${listName}">🔀 Ngẫu nhiên</button></div>`;
 if(P.drill==='trace') return `<div class="panel"><p class="muted">Tô 1–2 lần, vừa tô vừa đọc to. Bước này chưa cần chấm${P.session?' — cuối phiên em sẽ kiểm tra lại từ này':''}.</p>${nav}</div>`;
 const g=d.graded; let inner='';
 if(g){
  inner=`<div class="feedback ${g.ok?'':'incorrect'}">
   <b style="font-size:17px">${g.ok?(g.override?'✓ Tính là đúng (anh xác nhận)':g.self?'✓ Anh tự chấm: đúng':'✓ Chính xác!'):(g.self?'✗ Anh tự chấm: còn chỗ sai':`✗ Chưa đúng · giống khoảng ${g.score}%`)}</b>
   ${!g.self&&!g.ok&&g.ops.length?diffHtml(g):''}
   <div class="answer-reveal"><span class="muted">Đáp án:</span> <b class="lime" style="font-size:20px">${esc(P.target)}</b>${P.word&&P.word.ipa?` <span class="ipa">${esc(P.word.ipa)}</span>`:''}</div>
   ${P.drill==='translate'&&!g.ok?'<p class="field-help">Một câu có thể dịch theo nhiều cách. Nếu câu của anh khác mẫu nhưng vẫn đúng nghĩa và đúng ngữ pháp, anh có thể tính là đúng.</p>':''}
   <div class="btn-row" style="margin-top:10px">${speakBtns()}
    ${!g.ok&&!g.self?`<button class="btn outline" data-act="ansoverride">${P.drill==='translate'?'Câu của anh cũng đúng — tính là đúng':'iPad đọc nhầm chữ của anh — tính là đúng'}</button>`:''}
    ${!g.ok?`<button class="btn outline" data-act="rewrite">✍️ Tô lại cho đúng một lần</button>`:''}</div>
  </div>`;
 } else if(inkPrefs.gmode==='self'){
  inner=!d.revealed?`<p class="muted">Viết xong trên giấy thì bấm để xem đáp án và tự so từng chữ.</p><button class="btn" data-act="ansreveal">👀 Hiện đáp án</button>`
   :`<div class="answer-reveal"><span class="muted">Đáp án:</span> <b class="lime" style="font-size:22px">${esc(P.target)}</b></div><p class="muted">So kỹ từng chữ cái với bài viết trên giấy.</p>
   <div class="btn-row"><button class="btn" data-act="ansself" data-id="ok">✓ Em viết đúng</button><button class="btn danger" data-act="ansself" data-id="bad">✗ Có chỗ sai</button></div>`;
 } else if(d.stage==='confirm'){
  inner=`<div class="subtle-panel"><p class="eyebrow" style="margin-top:0">EM SẼ CHẤM ĐÚNG VĂN BẢN NÀY</p><p class="confirm-text">${esc(d.answer)}</p>
   <p class="field-help">Nếu iPad đổi nhầm chữ viết tay của anh, bấm “Sửa lại” rồi xác nhận lại.</p></div>
   <div class="btn-row" style="margin-top:10px"><button class="btn" data-act="ansconfirm">✓ Đúng rồi, chấm đi</button><button class="btn outline" data-act="ansedit">✎ Sửa lại</button></div>`;
 } else {
  inner=`<label><span class="field-label">Viết lại ${P.k==='s'?'cả câu':'từ đó'} vào ô dưới bằng Apple Pencil — iPad tự đổi thành chữ (hoặc gõ phím)</span>
   <textarea id="answerBox" class="scribble-box ${P.k==='s'?'long':''}" data-act="answerinput" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Viết vào đây…">${esc(d.answer)}</textarea></label>
   ${d.err?`<p class="save-error">${esc(d.err)}</p>`:''}

 }
 const modes=g?'':`<div class="seg" style="margin-bottom:10px">${[['scribble','✍️ Viết vào ô để em chấm'],['self','👀 Tự chấm']].map(([id,l])=>`<button class="chip ${inkPrefs.gmode===id?'active':''}" data-act="gmode" data-id="${id}">${l}</button>`).join('')}</div>`;
 return `<div class="panel"><p class="eyebrow">CHẤM BÀI</p>${modes}${inner}<div style="margin-top:14px">${nav}</div></div>`;
}
function renderScribbleTip(){

 <li>Vào <b>Cài đặt → Cài đặt chung → Bàn phím → Bàn phím</b>, đảm bảo có bàn phím <b>English</b> để iPad nhận chữ tiếng Anh tốt hơn.</li>
 <li>Ở ô “Viết vào đây”, viết thẳng bằng bút. iPad đổi chữ viết thành văn bản ngay trên máy.</li></ol>
 <p class="reference-note">Lưu ý: Scribble đôi khi tự sửa một từ viết sai chính tả thành từ đúng, nên chấm chính tả qua Scribble chưa chính xác tuyệt đối. Vì vậy em luôn cho anh xem lại văn bản trước khi chấm, và có thêm chế độ “Tự chấm”. Nét viết trên khung giấy thì máy không đọc.</p></details>`;

function renderDaily(){
 const st=vocabSettings(), v=todayVocab(), s=vocabStats();
 const stats=`<div class="asset-summary">
  <div><span class="small-label">TỪ ĐÃ HỌC</span><div class="money-number">${s.learned}<small class="muted" style="font-size:13px"> / ${s.total}</small></div><div class="progress" style="margin-top:6px"><div style="width:${s.total?s.learned/s.total*100:0}%"></div></div></div>
  <div><span class="small-label">ĐÃ THUỘC CHẮC</span><div class="money-number">${s.mastered}</div><small class="muted">vẫn nhớ đúng sau ≥ 7 ngày</small></div>
  <div><span class="small-label">CHUỖI NGÀY LUYỆN VIẾT</span><div class="money-number">${s.streak} 🔥</div><small class="muted">${s.weak} từ hay sai đang theo dõi</small></div></div>`;
 let main='';
 if(!v.started){
  const nw=v.items.filter(i=>i.intro), rv=v.items.filter(i=>i.k==='w'&&!i.intro&&!i.isNew), ss=v.items.filter(i=>i.k==='s');

  main=`<section class="spotlight" style="margin-bottom:16px"><span class="mini-pill">PHIÊN HỌC HÔM NAY · KHOẢNG ${mins} PHÚT</span>

   ${nw.length?`<p>Từ mới: ${nw.map(i=>`<b class="lime">${esc((wordById(i.id)||{}).en||'')}</b>`).join(' · ')}</p>`:''}
   <p class="muted" style="font-size:13px">Từ mới: tô chữ trước, cuối phiên viết lại từ trí nhớ. Từ ôn: nhìn nghĩa → nghe viết → điền vào câu (anh càng nhớ lâu thì bài càng khó). Câu: chép → nghe viết → dịch.</p>
   ${v.items.length?`<button class="btn" data-act="vdstart">▶ Bắt đầu phiên</button>`:`<p>Hôm nay không có từ nào đến lịch ôn và số từ mới đang là 0. Mở “Tùy chỉnh phiên học” để thêm từ mới.</p>`}</section>`;

  main=`<section class="spotlight" style="margin-bottom:16px"><span class="mini-pill">ĐÃ XONG PHIÊN HÔM NAY</span>

   ${bad.length?`<p>Cần chú ý: ${bad.map(i=>`<b>${esc(label(i))}</b>`).join(' · ')}</p><p class="muted" style="font-size:13px">Những mục sai sẽ quay lại vào ngày mai.</p>`:graded.length?'<p>Không sai mục nào. Rất tốt!</p>':''}

 } else {
  const P=currentPractice(), it=v.items[v.idx];

  main=`<div class="panel slim"><div class="card-header"><b>Mục ${v.idx+1}/${v.items.length}</b><span class="muted">${kind}</span></div><div class="progress"><div style="width:${v.idx/v.items.length*100}%"></div></div></div>`
   +(P?renderPracticeBody(P):`<div class="panel"><p class="muted">Mục này không còn trong kho (có thể anh đã xóa từ tự thêm).</p><button class="btn" data-act="vdskip">Tiếp →</button></div>`);
 }
 const tp=topicProgress();

  <div class="form-pair"><label><span class="field-label">Từ mới mỗi ngày</span><select data-act="vdset" data-key="newPerDay">${opt([0,3,5,8,10,15,20],st.newPerDay)}</select></label>
  <label><span class="field-label">Câu mới mỗi ngày</span><select data-act="vdset" data-key="newSentences">${opt([0,1,2,3,5],st.newSentences)}</select></label></div>
  <label><span class="field-label">Tối đa số từ ôn mỗi ngày</span><select data-act="vdset" data-key="maxReviews">${opt([20,40,60,100],st.maxReviews)}</select></label>

  <p class="field-help">Gợi ý cho người mới bắt đầu: 5–8 từ mới mỗi ngày là vừa sức. Từ nhớ đúng sẽ quay lại sau 1, 3, 7, 14, 30… ngày; từ sai quay lại ngày hôm sau.</p>
  ${v.started&&v.idx<v.items.length?`<p class="field-help">Thay đổi áp dụng cho phiên mới. <button class="btn outline sm" data-act="vdrestart">Tạo lại phiên hôm nay</button></p>`:''}
 </div>`:''}</div>`;
 return stats+main+settings+renderScribbleTip();
}

/* ---------------- bộ vẽ: 2 lớp canvas (giấy + mực), nét mượt theo lực nhấn ---------------- */
const inkLive={pointerId:null,stroke:null,erasing:false,snap:false,H:0};
function inkRowH(){ return (INK_SIZES[inkPrefs.size]||INK_SIZES.M).rowH; }
function inkHeight(d){ return Math.round(d.rows*inkRowH()+24); }
function inkGhostLines(ctx,text,rowH){
 ctx.font=`${Math.round(rowH*0.52)}px ${GHOST_FONT}`;
 const lines=[]; let cur='';
 String(text).split(/\s+/).forEach(w=>{ const t=cur?cur+' '+w:w; if(cur&&ctx.measureText(t).width>INK_W-80){ lines.push(cur); cur=w; } else cur=t; });
 if(cur) lines.push(cur); return lines;
}
function drawPaper(c,d,rowH,H){
 const ctx=c.getContext('2d'); const s=c.width/INK_W; ctx.setTransform(s,0,0,s,0,0);
 ctx.fillStyle='#fdfaf1'; ctx.fillRect(0,0,INK_W,H);
 const top=12, p=inkPrefs.paper;
 const line=(y,color,w,dash)=>{ ctx.beginPath(); ctx.setLineDash(dash||[]); ctx.strokeStyle=color; ctx.lineWidth=w; ctx.moveTo(24,y); ctx.lineTo(INK_W-24,y); ctx.stroke(); };
 if(p==='grid'){ ctx.setLineDash([]); ctx.strokeStyle='#ece6d3'; ctx.lineWidth=1; for(let x=20;x<=INK_W;x+=40){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); } for(let y=12;y<=H;y+=40){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(INK_W,y); ctx.stroke(); } }
 for(let r=0;r<d.rows;r++){
  const y0=top+r*rowH;
  if(p==='4line'){ line(y0+rowH*0.18,'#d9d2bb',1); line(y0+rowH*0.43,'#d6cfba',1,[8,8]); line(y0+rowH*0.68,'#8fadc9',1.8); line(y0+rowH*0.93,'#e6dfcb',1); }
  else if(p==='lines'){ line(y0+rowH*0.75,'#d0c9b2',1.2); }
 }
 ctx.setLineDash([]);
 if(d.ghostOn&&d.ghostText){
  const lines=inkGhostLines(ctx,d.ghostText,rowH);
  ctx.textBaseline='alphabetic'; ctx.lineWidth=1.2;
  lines.forEach((ln,i)=>{ const y=top+i*rowH+rowH*0.68; ctx.fillStyle='rgba(22,92,154,0.16)'; ctx.fillText(ln,40,y); ctx.strokeStyle='rgba(22,92,154,0.38)'; ctx.strokeText(ln,40,y); });
 }
}
function pwidth(s,p){ return s.w*(p==null?1:(0.35+p*1.3)); }
function inkStyle(ctx,s){ ctx.strokeStyle=s.c; ctx.fillStyle=s.c; ctx.lineCap='round'; ctx.lineJoin='round'; }
function inkDot(ctx,s){ const p=s.pts[0]; ctx.beginPath(); ctx.arc(p[0],p[1],pwidth(s,p[2])/2,0,Math.PI*2); ctx.fill(); }
function inkSeg(ctx,s,i){
 const P=s.pts, b=P[i-1], c=P[i], a=i>=2?P[i-2]:null;
 const m1=a?[(a[0]+b[0])/2,(a[1]+b[1])/2]:b, m2=[(b[0]+c[0])/2,(b[1]+c[1])/2];
 ctx.lineWidth=pwidth(s,b[2]); ctx.beginPath(); ctx.moveTo(m1[0],m1[1]); ctx.quadraticCurveTo(b[0],b[1],m2[0],m2[1]); ctx.stroke();
}
function inkTail(ctx,s){ const P=s.pts,n=P.length; if(n<2) return; const b=P[n-2],c=P[n-1]; ctx.lineWidth=pwidth(s,c[2]); ctx.beginPath(); ctx.moveTo((b[0]+c[0])/2,(b[1]+c[1])/2); ctx.lineTo(c[0],c[1]); ctx.stroke(); }
function drawStroke(ctx,s){ inkStyle(ctx,s); if(s.pts.length===1){ inkDot(ctx,s); return; } for(let i=1;i<s.pts.length;i++) inkSeg(ctx,s,i); inkTail(ctx,s); }
function inkRedraw(fg,d){
 const ctx=fg.getContext('2d'); ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,fg.width,fg.height);
 const s=fg.width/INK_W; ctx.setTransform(s,0,0,s,0,0);
 d.strokes.forEach(st=>drawStroke(ctx,st));
}
function pushUndo(d){ d.undo.push(d.strokes.slice()); if(d.undo.length>60) d.undo.shift(); }
function inkButtonsSync(d){
 document.querySelectorAll('[data-act="inkundo"]').forEach(b=>b.disabled=!d.undo.length);
 document.querySelectorAll('[data-act="inkredo"]').forEach(b=>b.disabled=!d.redo.length);
}
function inkRefresh(d){ const fg=document.getElementById('inkFg'); if(fg) inkRedraw(fg,d); inkButtonsSync(d); inkAutosave(); }
function distToSeg(p,a,b){ const dx=b[0]-a[0], dy=b[1]-a[1]; const L=dx*dx+dy*dy; let t=L?((p[0]-a[0])*dx+(p[1]-a[1])*dy)/L:0; t=clamp(t,0,1); const x=a[0]+t*dx-p[0], y=a[1]+t*dy-p[1]; return Math.sqrt(x*x+y*y); }
function inkEraseAt(fg,d,pt){
 const R=12+inkPrefs.width*2;
 const keep=d.strokes.filter(s=>{ const P=s.pts; for(let i=0;i<P.length;i++){ if(distToSeg(pt,P[i],P[i+1]||P[i])<=R+s.w/2) return false; } return true; });

function initInkCanvas(){
 const wrap=document.getElementById('inkWrap'), d=S.inkDraft; if(!wrap||!d) return;
 const bg=document.getElementById('inkBg'), fg=document.getElementById('inkFg');
 inkLive.pointerId=null; inkLive.stroke=null; S.inkBusy=false;
 const rowH=inkRowH();
 if(d.ghostOn&&d.ghostText){ const need=inkGhostLines(bg.getContext('2d'),d.ghostText,rowH).length; if(need>d.rows) d.rows=need; }
 const H=inkHeight(d);
 const cssW=wrap.clientWidth||Math.min(window.innerWidth-40,1000), cssH=cssW*H/INK_W;
 wrap.style.height=cssH+'px';
 const dpr=Math.min(window.devicePixelRatio||1,3), pw=Math.round(cssW*dpr), ph=Math.round(cssH*dpr);
 [bg,fg].forEach(c=>{ c.width=pw; c.height=ph; c.style.width=cssW+'px'; c.style.height=cssH+'px'; });
 inkLive.H=H;
 drawPaper(bg,d,rowH,H); inkRedraw(fg,d);
 fg.style.touchAction=inkPrefs.penOnly?'pan-y':'none';
 const ctx=fg.getContext('2d');
 const pos=e=>{ const r=fg.getBoundingClientRect(); const p=e.pointerType==='pen'?Math.round((e.pressure||0.5)*100)/100:null;
  return [(e.clientX-r.left)*INK_W/r.width,(e.clientY-r.top)*H/r.height,p]; };
 fg.addEventListener('pointerdown',e=>{
  if(e.pointerType==='pen'&&!inkPrefs.penSeen){ inkPrefs.penSeen=true; inkPrefs.penOnly=true; saveInkPrefs(); fg.style.touchAction='pan-y'; }
  if(e.pointerType==='touch'&&inkPrefs.penOnly) return; // chống chạm nhầm lòng bàn tay
  if(inkLive.pointerId!==null) return;
  if(e.pointerType==='mouse'&&e.button!==0) return;
  e.preventDefault();
  try{ fg.setPointerCapture(e.pointerId); }catch(err){}
  inkLive.pointerId=e.pointerId; inkLive.snap=false; S.inkBusy=true;
  inkLive.erasing=inkPrefs.tool==='eraser'||(e.buttons&32)===32; // đầu tẩy của bút (nếu thiết bị hỗ trợ)
  const pt=pos(e);
  if(inkLive.erasing){ inkEraseAt(fg,d,pt); return; }
  pushUndo(d); d.redo=[];
  const s={c:inkPrefs.color,w:inkPrefs.width,pts:[pt]}; d.strokes.push(s); inkLive.stroke=s;
  inkStyle(ctx,s); inkDot(ctx,s);
 });
 fg.addEventListener('pointermove',e=>{
  if(e.pointerId!==inkLive.pointerId) return;
  e.preventDefault();
  const list=e.getCoalescedEvents?e.getCoalescedEvents():[]; const evs=list.length?list:[e];
  for(const ev of evs){
   const pt=pos(ev);
   if(inkLive.erasing){ inkEraseAt(fg,d,pt); continue; }
   const s=inkLive.stroke; if(!s) return;
   const last=s.pts[s.pts.length-1]; if(Math.abs(pt[0]-last[0])+Math.abs(pt[1]-last[1])<0.6) continue;
   s.pts.push(pt); inkStyle(ctx,s); inkSeg(ctx,s,s.pts.length-1);
  }
 });
 const end=e=>{
  if(e.pointerId!==inkLive.pointerId) return;
  if(inkLive.stroke){ inkStyle(ctx,inkLive.stroke); inkTail(ctx,inkLive.stroke); }

 };
 fg.addEventListener('pointerup',end); fg.addEventListener('pointercancel',end);
 // Khi chỉ vẽ bằng bút: ngón tay vẫn cuộn trang được, còn bút thì không làm trang bị cuộn
 const blockTouch=e=>{ if(!inkPrefs.penOnly){ e.preventDefault(); return; } for(const t of e.changedTouches){ if(t.touchType==='stylus'){ e.preventDefault(); return; } } };
 fg.addEventListener('touchstart',blockTouch,{passive:false}); fg.addEventListener('touchmove',blockTouch,{passive:false});
}

function handleStudyAction(act,id,el){
 const st=studyState(), d=S.inkDraft, list=el.dataset.list;
 const P=()=>currentPractice();
 if(act.startsWith('num')) return handleNumAction(act,id,el);
 switch(act){

  case 'studytab': Speech.stop(); st.tab=id; S.inkDraft=null; S.view='study'; render(); return true;
  /* phiên hôm nay */
  case 'vdstart': case 'vdrestart': Speech.stop(); S.inkDraft=null; mutate(data=>{ const v=buildVocabDaily(); v.started=true; data.vocabDaily=v; }); scrollToPractice(); return true;

  case 'vdskip': vdAdvance(true); return true;
  case 'vdextend': S.inkDraft=null; mutate(data=>{
   const v=data.vocabDaily; const fresh=nextNewWords(5,v.items.map(i=>i.id));
   fresh.forEach(w=>v.items.push({k:'w',id:w.id,drill:'trace',intro:true,res:null}));

  }); scrollToPractice(); return true;
  case 'vdweak': Object.assign(st.word,{source:'bank',topic:'all',level:0,status:'wrong',index:0,drill:'meaning'}); st.tab='word'; S.inkDraft=null; render(); return true;
  case 'vdsettings': S.vdSettingsOpen=!S.vdSettingsOpen; render(); return true;
  case 'vdset': mutate(()=>{ vocabSettings()[el.dataset.key]=Number(el.value); }); return true;
  case 'vdtopic': mutate(()=>{ const s=vocabSettings(); const i=s.topics.indexOf(id);
   if(i>=0){ if(s.topics.length>1) s.topics.splice(i,1); else toast('Cần giữ ít nhất một chủ đề.'); } else s.topics.push(id);
   s.topics.sort((a,b)=>TOPICS.findIndex(t=>t.id===a)-TOPICS.findIndex(t=>t.id===b)); }); return true;
  /* luyện từ / luyện câu */
  case 'lsrc': st[list].source=id; st[list].index=0; S.inkDraft=null; render(); return true;
  case 'filter': { const L=st[list], k=el.dataset.key; L[k]=k==='level'?Number(el.value):el.value; if(list==='bank') L.page=0; else L.index=0; S.inkDraft=null; render(); return true; }
  case 'llesson': st[list].lessonId=el.value; st[list].index=0; S.inkDraft=null; render(); return true;
  case 'lprev': Speech.stop(); st[list].index=Math.max(0,st[list].index-1); S.inkDraft=null; render(); scrollToPractice(); return true;
  case 'lnext': Speech.stop(); st[list].index++; S.inkDraft=null; render(); scrollToPractice(); return true;
  case 'lrand': { Speech.stop(); const n=(list==='word'?wordPracticeList():sentencePracticeList()).length;
   if(n>1){ let j; do{ j=Math.floor(Math.random()*n); }while(j===st[list].index); st[list].index=j; }
   S.inkDraft=null; render(); scrollToPractice(); return true; }
  case 'ldrill': st[list].drill=id; S.inkDraft=null; render(); return true;
  /* kho từ */
  case 'bankq': st.bank.q=el.value; st.bank.page=0; render(); return true;
  case 'banktopic': st.bank.topic=st.bank.topic===id?'all':id; st.bank.page=0; render(); return true;
  case 'bankpage': st.bank.page=Number(id); render(); window.scrollTo(0,0); return true;
  case 'bankspeak': { const w=wordById(id); if(w) Speech.speakOne(w.en+'. '+(w.exEn||''),0.85); return true; }

  case 'customdel': mutate(data=>{ data.customWords=(data.customWords||[]).filter(w=>w.id!==id); if(data.wordCards) delete data.wordCards[id]; }); return true;
  /* bút & giấy */
  case 'inktool': inkPrefs.tool=id; saveInkPrefs(); render(); return true;
  case 'inkcolor': inkPrefs.color=id; inkPrefs.tool='pen'; saveInkPrefs(); render(); return true;

  case 'inksize': inkPrefs.size=id; saveInkPrefs(); render(); return true;
  case 'inkpenonly': inkPrefs.penOnly=el.checked; inkPrefs.penSeen=true; saveInkPrefs(); render(); return true;
  case 'inkrows': if(d){ d.rows=clamp(d.rows+Number(id),1,12); inkAutosave(); } render(); return true;
  case 'inkmore': S.inkMore=!S.inkMore; render(); return true;

  case 'inkundo': if(d&&d.undo.length){ d.redo.push(d.strokes); d.strokes=d.undo.pop(); inkRefresh(d); } return true;
  case 'inkredo': if(d&&d.redo.length){ d.undo.push(d.strokes); d.strokes=d.redo.pop(); inkRefresh(d); } return true;
  case 'inkclear': if(d&&d.strokes.length){ pushUndo(d); d.redo=[]; d.strokes=[]; inkRefresh(d); } return true;
  case 'inkexport': exportInkPng(); return true;
  case 'inksave': if(d){ persistInk(d,true); toast('Đã lưu trang viết trên máy.'); } return true;
  case 'inknote': if(d){ d.note=el.value; inkAutosave(); } return true;
  case 'typedtext': if(d){ d.typed=el.value; inkAutosave(); } return true;
  /* chấm bài */
  case 'answerinput': if(d){ d.answer=el.value; d.err=''; } return true;
  case 'gmode': inkPrefs.gmode=id; saveInkPrefs(); if(d){ d.stage='write'; d.revealed=false; } render(); return true;
  case 'anscheck': { if(!d) return true; const ta=document.getElementById('answerBox'); if(ta) d.answer=ta.value;
   if(!String(d.answer||'').trim()){ d.err='Anh viết câu trả lời vào ô trước nhé.'; render(); return true; }
   d.stage='confirm'; render(); return true; }
  case 'ansedit': if(d) d.stage='write'; render(); return true;
  case 'ansconfirm': { const p=P(); if(!p||!d) return true; d.graded=gradeAnswer(p.target,d.answer,p.k==='s'?'word':'char'); d.stage='graded'; recordWriting(p,d); render(); return true; }
  case 'ansreveal': if(d) d.revealed=true; render(); return true;
  case 'ansself': { const p=P(); if(!p||!d) return true; d.graded={ok:id==='ok',score:id==='ok'?100:0,self:true,ops:[],unit:''}; d.stage='graded'; recordWriting(p,d); render(); return true; }
  case 'ansoverride': if(d&&d.graded){ d.graded.ok=true; d.graded.override=true; const ev=(S.data.writingEvents||[]).find(x=>x.id===d.eventId); if(ev){ ev.ok=1; ev.override=1; } quietSave(); } render(); return true;
  case 'anshint': if(d) d.hint=true; render(); return true;
  case 'rewrite': if(d){ pushUndo(d); d.strokes=[]; d.redo=[]; d.ghostOn=true; } render(); return true;
  case 'speakcur': case 'speakcurslow': { const p=P(); if(p&&p.speak) Speech.speakOne(p.speak,act==='speakcurslow'?0.6:0.9); return true; }
  case 'speakex': { const p=P(); if(p&&p.word&&p.word.exEn) Speech.speakOne(p.word.exEn,0.85); return true; }
  /* viết tự do */
  case 'freeprompt': st.free.promptId=st.free.promptId===id?'':id; if(st.free.promptId) st.free.lessonId=''; S.inkDraft=null; render(); return true;
  case 'freelesson': st.free.lessonId=el.value; if(el.value) st.free.promptId=''; S.inkDraft=null; render(); return true;
  case 'copytext': copyToClipboard(d?d.typed:'','Đã sao chép văn bản vào clipboard.'); return true;
  case 'copyprompt': { const lesson=allLessons.find(l=>l.id===st.free.lessonId), pr=FREE_PROMPTS.find(p=>p.id===st.free.promptId); copyToClipboard(buildFeedbackPrompt(d,lesson,pr),'Đã sao chép prompt vào clipboard.'); return true; }
 }
 return false;
}

function enUnder1000(n){ const out=[]; if(n>=100){ out.push(EN_ONES[Math.floor(n/100)]+' hundred'); n%=100; } if(n>=20) out.push(EN_TENS[Math.floor(n/10)]+(n%10?'-'+EN_ONES[n%10]:'')); else if(n>0) out.push(EN_ONES[n]); return out.join(' '); }

 const mkDate=(d,mo,y)=>{ d=+d; mo=+mo; y=+y; const dim=new Date(Date.UTC(y,mo,0)).getUTCDate();

 if((m=t.match(/^(\d[\d.,]*)\s*(%|phần trăm|percent)$/))){ const v=parseAmount(m[1],null,true); return isNaN(v)?{error:'Chưa đọc được con số.'}:{kind:'percent',value:v,raw}; }

let simState={initial:'0',monthly:'0',rate:'0',years:10};
function renderSavingsSimulator(){
 const vals=[simState.initial,simState.monthly,simState.rate].map(Number);
 const valid=[simState.initial,simState.monthly,simState.rate].every(v=>String(v).trim()!=='') && vals.every(Number.isFinite) && vals[0]>=0 && vals[1]>=0 && vals[0]<=1e15 && vals[1]<=1e15 && vals[2]>=-50 && vals[2]<=30;
 let result=null; try{ result = valid?projectSavings(vals[0],vals[1],vals[2],simState.years):null; }catch(e){ result=null; }
 const points=result?result.points:[0,0]; const min=Math.min(...points), max=Math.max(...points), range=Math.max(1,max-min);
 const poly=points.map((p,i)=>`${i/(points.length-1)*600},${108-(p-min)/range*95}`).join(' ');
 return `<section class="panel"><h2>Nếu mình tích lũy đều đặn?</h2><p class="reference-note">Một phép mô phỏng để hiểu thời gian và lãi kép. Đây không phải dự báo hay mức sinh lời được bảo đảm.</p>
 <div class="form-pair" style="margin-bottom:12px"><label><span class="field-label">Số tiền ban đầu (VND)</span><input type="number" id="simInitial" value="${esc(simState.initial)}"></label><label><span class="field-label">Góp cuối mỗi tháng (VND)</span><input type="number" id="simMonthly" value="${esc(simState.monthly)}"></label></div>
 <label><span class="field-label">Lợi suất giả định mỗi năm (%)</span><input type="number" id="simRate" value="${esc(simState.rate)}"></label>
 <label><span class="field-label">Thời gian: ${simState.years} năm</span><input type="range" id="simYears" min="1" max="30" value="${simState.years}"></label>
 ${result?`<p class="small-label" style="margin-top:14px">Giá trị mô phỏng sau ${simState.years} năm</p><p style="font-size:24px;font-weight:800" class="lime">${money(result.value)} ₫</p><p class="field-help">Tổng tiền tự góp: ${money(result.contributions)} ₫</p>
 <svg class="chart" viewBox="0 0 600 120" preserveAspectRatio="none"><line x1="0" y1="115" x2="600" y2="115" stroke="#39492b"/><polyline points="${poly}" fill="none" stroke="#d8f36a" stroke-width="2.5"/></svg>`:`<p class="save-error" style="margin-top:12px">Nhập đủ số hợp lệ. Tiền từ 0 đến 1 triệu tỷ VND; lợi suất giả định từ −50% đến 30%.</p>`}
 </section>`;
}

/* ================= events ================= */
function bindApp(){
 document.querySelectorAll('[data-nav]').forEach(el=>el.addEventListener('click',()=>{ S.view=el.dataset.nav; render(); }));
 const openProfile=()=>{ S.profileOpen=true; render(); };
 const p1=document.getElementById('openProfile'); if(p1) p1.addEventListener('click',openProfile);
 const p2=document.getElementById('openProfile2'); if(p2) p2.addEventListener('click',openProfile);
 const h=document.getElementById('openHelp'); if(h) h.addEventListener('click',()=>{ S.helpOpen=true; render(); });
 const rl=document.getElementById('retryLoad'); if(rl) rl.addEventListener('click',loadState);

 /* Mỗi loại phần tử cần đúng sự kiện của nó: select/checkbox dùng change,
  * ô chữ dùng input, thanh trượt dùng change (iPad kéo mượt hơn), còn lại dùng click. */
 document.querySelectorAll('[data-act]').forEach(el=>{
  const tag=el.tagName;
  if(tag==='SELECT') el.addEventListener('change',e=>onAction(el,e));
  else if(tag==='TEXTAREA') el.addEventListener('input',e=>onAction(el,e));
  else if(tag==='INPUT'){
   const t=(el.type||'').toLowerCase();
   if(t==='range') el.addEventListener('change',e=>onAction(el,e));
   else if(t==='checkbox'||t==='radio') el.addEventListener('change',e=>onAction(el,e));
   else el.addEventListener('input',e=>onAction(el,e));
  }
  else el.addEventListener('click',e=>onAction(el,e));
 });
 /* Ô ghi chép bài học: cập nhật trạng thái nút "Hoàn thành" ngay khi anh gõ,
  * nhưng không render lại để không mất con trỏ. */
 const lr=document.getElementById('lessonReflection');
 if(lr) lr.addEventListener('input',()=>{
  S.lessonUi=Object.assign({},S.lessonUi,{reflection:lr.value});
  const btn=document.querySelector('[data-act="finishlesson"]');
  if(btn && S.selectedLesson){
   const st=S.lessonUi||{};
   const answer = st.answer!==undefined ? st.answer : '';
   const correct = st.checked && answer!=='' && Number(answer)===S.selectedLesson.correct;
   btn.disabled = !(correct && lr.value.trim().length>=10);
  }
 });
 document.querySelectorAll('[data-plan-ev]').forEach(el=>el.addEventListener('change',()=>{
  const stage=el.dataset.planEv, field=el.dataset.planField;
  savePlan(plan=>{ const p={...plan}; p.evidence={...p.evidence}; p.evidence[stage]={...(p.evidence[stage]||{work:'',result:'',next:''})}; p.evidence[stage][field]=el.value; return p; });
 }));
 const pf=document.getElementById('planFocus'); if(pf) pf.addEventListener('change',()=>savePlan(p=>({...p,focus:pf.value})));
 const prd=document.getElementById('planReviewDate'); if(prd) prd.addEventListener('change',()=>savePlan(p=>({...p,reviewDate:prd.value})));
 const po=document.getElementById('planOutcome'); if(po) po.addEventListener('change',()=>savePlan(p=>({...p,outcome:po.value})));

 ['simInitial','simMonthly','simRate'].forEach(id=>{ const el=document.getElementById(id); if(el) el.addEventListener('input',()=>{ simState[id.replace('sim','').toLowerCase()]=el.value; render(); }); });
 const sy=document.getElementById('simYears'); if(sy) sy.addEventListener('input',()=>{ simState.years=Number(sy.value); render(); });

 const ri=document.getElementById('restoreInput');
 if(ri) ri.addEventListener('change',()=>{
  const file=ri.files&&ri.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=()=>{
   let parsed=null;
   try{ parsed=JSON.parse(reader.result); }catch(e){ S.restoreFile={error:'Tệp không đọc được dưới dạng JSON: '+e.message}; render(); return; }
   const check=validateBackup(parsed);
   S.restoreFile = check.ok ? {data:parsed} : {error:check.error};
   render();
  };
  reader.onerror=()=>{ S.restoreFile={error:'Chưa đọc được tệp.'}; render(); };
  reader.readAsText(file);
 });

 document.querySelectorAll('.overlay').forEach(ov=>ov.addEventListener('click',(e)=>{ if(e.target===ov) closeAllModals(); }));
}
function closeAllModals(){ Speech.stop(); S.selectedLesson=null; S.review=null; S.editor=null; S.growthEditor=null; S.resolving=null; S.deletion=null; S.growthDeletion=null; S.profileOpen=false; S.helpOpen=false; S.lessonUi=null; S.reviewUi=null; S.editorError=null; S.growthError=null; S.resolveError=null; S.resolveUi=null; S.entryTest=null; S.restoreFile=null; render(); }

function onAction(el,e){
 const act=el.dataset.act, id=el.dataset.id, kind=el.dataset.kind;
 if(act==='setlang'){ S.lang=id; render(); return; }
 if(act==='toggletr'){ S.lessonUi=Object.assign({},S.lessonUi,{hideTr:!(S.lessonUi&&S.lessonUi.hideTr)}); render(); return; }
 if(act==='setselfrating'){ S.lessonUi=Object.assign({},S.lessonUi,{selfRating:Number(el.value)}); render(); return; }
 if(act==='setvoice'){ Speech.voiceURI=el.value; return; }
 if(act==='playall'||act==='playallslow'){
  const rate = act==='playallslow'?0.6:1;
  Speech.speakList(englishSentences(S.selectedLesson), rate, ()=>render());
  return;
 }
 if(act==='playone'||act==='playoneslow'){
  const sentences=englishSentences(S.selectedLesson);
  Speech.speakOne(sentences[Number(el.dataset.i)], act==='playoneslow'?0.6:1);
  return;
 }
 if(act==='pausespeech'){ Speech.pause(); return; }
 if(act==='resumespeech'){ Speech.resume(); return; }
 if(act==='stopspeech'){ Speech.stop(); render(); return; }
 if(act==='speakvocab'){
  const c=lessonContent(S.selectedLesson); const v=c.vocab[Number(el.dataset.i)];
  if(v) Speech.speakOne(v.en+'. '+v.example, 0.85);
  return;
 }
 if(act==='practicevocab'){ openStudy('word', S.selectedLesson.id); return; }
 if(act==='writelesson'){ openStudy('sentence', S.selectedLesson.id); return; }
 if(act==='lesson'){ Speech.stop(); S.selectedLesson=allLessons.find(l=>l.id===id); S.lessonUi=null; render(); }
 if(act==='closelesson'){ S.selectedLesson=null; S.lessonUi=null; render(); }
 if(act==='togglesimple'){ S.lessonUi=Object.assign({},S.lessonUi,{simple:!(S.lessonUi&&S.lessonUi.simple)}); render(); }
 if(act==='lessonanswer'){ S.lessonUi=Object.assign({},S.lessonUi,{answer:document.querySelector('input[name="lessonanswer"]:checked').value,checked:false}); render(); }
 if(act==='checklesson'){ S.lessonUi=Object.assign({},S.lessonUi,{checked:true}); render(); }
 if(act==='finishlesson'){
  const ta=document.getElementById('lessonReflection'); const reflection=ta?ta.value:'';
  const sr=document.getElementById('selfRating');
  const lesson=S.selectedLesson; const answer=Number((S.lessonUi&&S.lessonUi.answer)||lesson.correct);
  Speech.stop();
  completeLesson(lesson.id,answer,reflection, sr?Number(sr.value):null); S.selectedLesson=null; S.lessonUi=null; render();
 }
 if(act==='nextlesson'){
  const idx=learningOrder.findIndex(l=>l.id===S.selectedLesson.id); const nxt=learningOrder[idx+1];
  S.selectedLesson=nxt||null; S.lessonUi=null; if(!nxt) S.view='academy'; render();
 }
 if(act==='applylesson'){ const lid=S.selectedLesson.id; S.selectedLesson=null; openCommitmentEditor('forecast',lid); }

 if(act==='review'){ S.review=S.data.reviews.find(r=>r.lesson_id===id); S.reviewUi=null; render(); }
 if(act==='closereview'){ S.review=null; S.reviewUi=null; render(); }
 if(act==='reviewanswer'){ S.reviewUi=Object.assign({},S.reviewUi,{answer:document.querySelector('input[name="reviewanswer"]:checked').value}); render(); }
 if(act==='submitreview'){
  const ans=Number((S.reviewUi&&S.reviewUi.answer)); const correct=submitReview(S.review,ans);
  S.reviewUi=Object.assign({},S.reviewUi,{result:{correct}}); render();
 }
 if(act==='nextreview'){ S.review=null; S.reviewUi=null; const nxt=dueReviews(S.data)[0]; if(nxt){ S.review=nxt; } render(); }
 if(act==='reviewreadlesson'){ const lid=S.review.lesson_id; S.review=null; S.reviewUi=null; S.selectedLesson=allLessons.find(l=>l.id===lid); render(); }

 /* ---- Đánh giá đầu vào ---- */
 if(act==='openentry'){ S.entryTest={index:0,score:0,answer:null,done:false}; render(); return; }
 if(act==='retryentry'){ S.entryTest={index:0,score:0,answer:null,done:false}; render(); return; }
 if(act==='closeentry'){ S.entryTest=null; render(); return; }
 if(act==='entryanswer'){ S.entryTest.answer=Number(document.querySelector('input[name="entryanswer"]:checked').value); render(); return; }
 if(act==='entrynext'){
  const t=S.entryTest, lessonId=ENTRY_IDS[t.index];
  if(Number(t.answer)===reviewQuestions[lessonId].correct) t.score++;
  if(t.index===ENTRY_IDS.length-1){
   t.done=true;
   mutate(d=>{ d.entryAssessment={score:t.score,total:ENTRY_IDS.length,completed_at:vnNow().toISOString()}; });
  } else { t.index++; t.answer=null; }
  render(); return;
 }
 /* ---- Phiên học hằng ngày ---- */
 if(act==='sessiondone'){
  const i=Number(el.dataset.i); const s=todaySession();
  s.items[i].done=!s.items[i].done;
  mutate(d=>{ d.dailySession=s; }); return;
 }
 if(act==='sessionopen'){
  const s=todaySession(), it=s.items[Number(el.dataset.i)];
  if(it.type==='review'){ const card=S.data.reviews.find(r=>r.lesson_id===it.id); if(card){ S.review=card; S.reviewUi=null; } }
  else if(it.type==='lesson'||it.type==='explain'){ S.selectedLesson=allLessons.find(l=>l.id===it.id); S.lessonUi=null; }
  else if(it.type==='listen'){ S.selectedLesson=allLessons.find(l=>l.id===it.id); S.lessonUi=null; S.lang= S.lang==='vi'?'song':S.lang; }
  else if(it.type==='write'){ openStudy('sentence', it.id, 0); return; }
  render(); return;
 }
 /* ---- Sổ lỗi: luyện lại, không đụng vào lịch ôn cách quãng ---- */
 if(act==='practicemistake'){
  const card=S.data.reviews.find(r=>r.lesson_id===id) || {lesson_id:id,revision:0,due:vnNow().toISOString()};
  S.review=Object.assign({},card,{practiceOnly:true}); S.reviewUi=null; render(); return;
 }
 /* ---- Bàn học ---- */
 if(handleGrowthAction(act,id,el)) return;
 if(handleStudyAction(act,id,el,e)) return;
 if(act==='academytab'){ academyTab=id; render(); }
 if(act==='projecttab'){ projectTab=id; render(); }
 if(act==='notestab'){ notesTab=id; render(); }

 if(act==='create'){ S.editor={kind:kind,data:defaultsFor(kind)}; S.editorError=null; render(); }
 if(act==='edit'){ const r=S.data.records.find(r=>r.id===id); S.editor={kind:r.kind,record:r,data:{...r.data}}; S.editorError=null; render(); }
 if(act==='closeeditor'){ S.editor=null; S.editorError=null; render(); }
 if(act==='saverecord'){ doSaveRecord(); }
 if(act==='delete'){ S.deletion=S.data.records.find(r=>r.id===id); render(); }
 if(act==='canceldelete'){ S.deletion=null; render(); }
 if(act==='confirmdelete'){ deleteRecord(S.deletion.id); S.deletion=null; render(); }

 if(act==='commitment'){ openCommitmentEditor(kind); }
 if(act==='closegrowth'){ S.growthEditor=null; S.growthError=null; render(); }
 if(act==='fillexample'){ fillCommitmentExample(); }
 if(act==='savegrowth'){ doSaveCommitment(); }
 if(act==='resolve'){ S.resolving=S.data.commitments.find(c=>c.id===id); S.resolveUi=null; S.resolveError=null; render(); }
 if(act==='closeresolve'){ S.resolving=null; S.resolveUi=null; render(); }
 if(act==='submitresolve'){ doSubmitResolve(); }
 if(act==='deletecommit'){ S.growthDeletion=S.data.commitments.find(c=>c.id===id); render(); }
 if(act==='cancelgrowthdelete'){ S.growthDeletion=null; render(); }
 if(act==='confirmgrowthdelete'){ deleteCommitment(S.growthDeletion.id); S.growthDeletion=null; render(); }

 if(act==='closeprofile'){ S.profileOpen=false; render(); }
 if(act==='saveprofile'){
  saveProfile({name:document.getElementById('profName').value.slice(0,60),minutes:Number(document.getElementById('profMinutes').value),goal:document.getElementById('profGoal').value.slice(0,1000)});
  S.profileOpen=false; render();
 }
 if(act==='exportdata'){ exportData(); }
 if(act==='pickrestore'){ const inp=document.getElementById('restoreInput'); if(inp) inp.click(); return; }
 if(act==='cancelrestore'){ S.restoreFile=null; render(); return; }
 if(act==='confirmrestore'){
  const o=S.restoreFile.data;
  const clean=normalizeState(o); delete clean.format; delete clean.version; delete clean.exported_at;
  S.data=clean; S.restoreFile=null; S.profileOpen=false; scheduleSave(); render();
  toast('Đã khôi phục dữ liệu từ tệp sao lưu.'); return;
 }
 if(act==='closehelp'){ S.helpOpen=false; render(); }
}

function openCommitmentEditor(kind,sourceLessonId){
 const projects=S.data.records.filter(r=>r.kind==='project');
 S.growthEditor={kind,data:{title:'',probability:60,criterion:'',resolveBy:futureDay(),evidence:'',counterEvidence:'',projectId:(projects[0]&&projects[0].id)||'',hypothesis:'',method:'',metric:'',threshold:'',unit:'người',comparator:'at-least',budget:'0',hours:'2',sourceLessonId:sourceLessonId||''}};
 S.growthError=null; render();
}
function readGrowthForm(){
 const data={...S.growthEditor.data};
 document.querySelectorAll('#root [data-f]').forEach(el=>{
  if(el.closest('[data-overlay="growth"]')){ data[el.dataset.f]=el.value; }
 });
 return data;
}
function fillCommitmentExample(){
 const isForecast=S.growthEditor.kind==='forecast';
 const data={...S.growthEditor.data, ...(isForecast?{
  title:'Trong 7 ngày, tôi sẽ hoàn thành 3 bài học mới.',probability:70,
  criterion:'Có ít nhất 3 bài học mới được hoàn thành trong ATLAS từ lúc ghi dự đoán đến hết ngày đối chiếu.',
  evidence:'Tôi dự định dành 15 phút mỗi ngày và có thể bắt đầu từ các bài nền tảng.',
  counterEvidence:'Lịch công việc có thể thay đổi; tôi từng bỏ lỡ kế hoạch khi đặt lịch không cụ thể.'
 }:{
  title:'Tìm hiểu nhu cầu của 5 người',hypothesis:'Ít nhất 2 trong 5 người phù hợp đã gặp vấn đề của dự án trong tháng vừa qua.',
  method:'Trao đổi riêng với 5 người phù hợp. Hỏi lần gần nhất họ gặp vấn đề và cách xử lý. Ghi câu trả lời cụ thể.',
  metric:'Người có trải nghiệm cụ thể',threshold:'2',unit:'người',budget:'0',hours:'2',comparator:'at-least'
 })};
 S.growthEditor.data=data; render();
}
function doSaveCommitment(){
 const data=readGrowthForm(); const isForecast=S.growthEditor.kind==='forecast';
 try{
  let plan;
  if(isForecast) plan={title:data.title,probability:Number(data.probability),criterion:data.criterion,resolveBy:data.resolveBy,evidence:data.evidence,counterEvidence:data.counterEvidence,sourceLessonId:data.sourceLessonId||''};
  else{
   if(['threshold','budget','hours'].some(k=>String(data[k]||'').trim()==='')) throw new Error('Anh nhập đủ số đo, giới hạn tiền và thời gian.');
   const project=S.data.records.find(r=>r.id===data.projectId);
   plan={title:data.title,projectId:data.projectId,projectTitle:project?project.data.title:'',hypothesis:data.hypothesis,method:data.method,metric:data.metric,threshold:Number(data.threshold),unit:data.unit,comparator:data.comparator,budget:Number(data.budget),hours:Number(data.hours),resolveBy:data.resolveBy,sourceLessonId:data.sourceLessonId||''};
  }
  if(!plan.title || !plan.resolveBy) throw new Error('Anh điền đủ thông tin trước khi lưu nhé.');
  createCommitment(S.growthEditor.kind,plan);
  const kind=S.growthEditor.kind;
  S.growthEditor=null; S.growthError=null;
  if(kind==='experiment'){ projectTab='experiments'; S.view='projects'; } else { notesTab='forecasts'; S.view='notes'; }
  toast('Đã giữ kế hoạch ban đầu. Anh có thể quay lại ghi kết quả.');
  render();
 }catch(e){ S.growthError=e.message; render(); }
}
function doSaveRecord(){
 const kind=S.editor.kind; const data={...S.editor.data};
 document.querySelectorAll('#root [data-overlay="editor"] [data-f]').forEach(el=>{ data[el.dataset.f]=el.value; });
 try{
  if(kind==='asset'||kind==='debt'){
   if(String(data.amount).trim()==='') throw new Error('Anh nhập giá trị trước khi lưu nhé.');
   data.amount=Number(data.amount); if(!Number.isFinite(data.amount)||data.amount<0) throw new Error('Giá trị cần là số từ 0 trở lên.');
  }
  if(kind==='project'&&!String(data.title||'').trim()) throw new Error('Anh nhập tên dự án.');
  if(kind==='note'&&!String(data.title||'').trim()) throw new Error('Anh nhập tiêu đề.');
  saveRecord(kind,data,S.editor.record?S.editor.record.id:undefined);
  S.editor=null; S.editorError=null; render();
 }catch(e){ S.editorError=e.message; render(); }
}
function doSubmitResolve(){
 const item=S.resolving; const isForecast=item.kind==='forecast';
 const outcomeEl=document.querySelector('#root [data-overlay="resolve"] [data-f="outcome"]');
 const outcome=outcomeEl?outcomeEl.value:'';
 const val=(f)=>{ const el=document.querySelector(`#root [data-overlay="resolve"] [data-f="${f}"]`); return el?el.value:''; };
 S.resolveUi={outcome,observed:val('observed'),spent:val('spent'),hours:val('hours'),evidence:val('evidence'),lesson:val('lesson')};
 try{
  let resolution;
  if(isForecast) resolution={outcome,evidence:S.resolveUi.evidence,lesson:S.resolveUi.lesson};
  else{
   if(S.resolveUi.spent.trim()===''||S.resolveUi.hours.trim()===''||(outcome==='measured'&&S.resolveUi.observed.trim()==='')) throw new Error('Anh nhập số đo và nguồn lực thực tế đã dùng.');
   resolution={outcome,observed:outcome==='measured'?Number(S.resolveUi.observed):null,spent:Number(S.resolveUi.spent),hours:Number(S.resolveUi.hours),evidence:S.resolveUi.evidence,lesson:S.resolveUi.lesson};
  }
  if(!outcome || S.resolveUi.evidence.trim().length<10 || S.resolveUi.lesson.trim().length<10) throw new Error('Anh ghi kết quả đo, bằng chứng và bài học (ít nhất 10 ký tự).');
  resolveCommitment(item.id,resolution);
  S.resolving=null; S.resolveUi=null; S.resolveError=null; render();
 }catch(e){ S.resolveError=e.message; render(); }
}

/* ================= boot ================= */
/* Không có màn đăng nhập — vào thẳng app, dữ liệu đọc từ máy ngay lập tức. */
Speech.init();
Speech.onVoicesChanged=()=>{ if(S.selectedLesson) render(); };
loadState().then(journalBoot);
</script>
