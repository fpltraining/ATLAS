<style>
/* ================= ATLAS design system =================
   Token màu, chữ, khoảng cách, bo góc, bóng, chuyển động. Component dùng token, không tự đặt màu riêng.
   Tương phản: chữ chính ≥ 7:1, chữ phụ ≥ 4.5:1 trên nền sáng và tối. Lime chỉ làm nền nhấn (chữ mực đặt lên), không làm màu chữ trên nền sáng. */
:root{
  --ink-900:#171B2E; --ink-800:#232842; --ink-700:#3A4060; --ink-600:#4C5372;
  --slate-600:#5F6676; --slate-500:#747B8C; --slate-300:#C5C9D2; --line:#E4E7EA;
  --ivory:#F7F7F2; --paper:#FFFFFF; --lime-400:#C7E85B; --lime-200:#DDF0A0; --lime-100:#EEF6D6; --lime-700:#4F6B00;
  --red-700:#A4281B; --red-100:#FBE9E6; --amber-700:#8A4B08; --amber-100:#FBF0DC;

  --bg:var(--ivory); --surface:var(--paper); --surface-2:#FBFBF8; --sunk:#EFEFE8;
  --text:var(--ink-900); --text-2:var(--slate-600);
  --border:var(--line); --border-strong:var(--slate-300);
  --accent:var(--lime-400); --accent-soft:var(--lime-100); --accent-text:var(--lime-700); --on-accent:var(--ink-900);
  --primary:var(--ink-900); --primary-hover:var(--ink-700); --on-primary:var(--ivory);
  --danger:var(--red-700); --danger-soft:var(--red-100); --warn:var(--amber-700); --warn-soft:var(--amber-100);
  --focus:var(--ink-900); --scrim:rgba(15,18,32,.45);
  --brand-dark:var(--ink-900); --brand-light:var(--slate-500); --brand-north:var(--lime-400); --brand-ring:var(--ink-900); --brand-ring-op:1; --brand-node:var(--lime-400); --brand-node-stroke:var(--ink-900);

  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
  --fs-display:clamp(30px,3.6vw,44px); --fs-h1:clamp(26px,2.8vw,34px); --fs-h2:22px; --fs-h3:18px;
  --fs-body:17px; --fs-small:15px; --fs-caption:13px; --fs-read:18px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s7:32px; --s8:40px; --s9:56px;
  --r-sm:10px; --r-md:14px; --r-lg:20px; --r-pill:999px;
  --shadow-1:0 1px 2px rgba(23,27,46,.06),0 1px 1px rgba(23,27,46,.04);
  --shadow-2:0 2px 6px rgba(23,27,46,.05),0 14px 36px rgba(23,27,46,.09);
  --ease:cubic-bezier(.2,.7,.2,1); --dur-1:140ms; --dur-2:220ms;
  --tap:44px; --sidebar:252px; --tabbar:64px;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0F1220; --surface:#171B2E; --surface-2:#1C2135; --sunk:#12152A;
  --text:#ECEDE6; --text-2:#A9AFBE; --border:#2C3247; --border-strong:#3D4460;
  --accent:#C7E85B; --accent-soft:#283219; --accent-text:#C7E85B; --on-accent:#171B2E;
  --primary:#C7E85B; --primary-hover:#D6EF82; --on-primary:#171B2E;
  --danger:#F19A8C; --danger-soft:#3A1E1A; --warn:#F2C27B; --warn-soft:#33270F;
  --focus:#C7E85B; --scrim:rgba(0,0,0,.6);
  --brand-dark:#F7F7F2; --brand-light:#8A90A2; --brand-ring:#F7F7F2; --brand-ring-op:.45; --brand-node-stroke:#171B2E;
  --shadow-1:0 1px 2px rgba(0,0,0,.4); --shadow-2:0 2px 6px rgba(0,0,0,.35),0 14px 36px rgba(0,0,0,.35);
  color-scheme:dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1220; --surface:#171B2E; --surface-2:#1C2135; --sunk:#12152A;
    --text:#ECEDE6; --text-2:#A9AFBE; --border:#2C3247; --border-strong:#3D4460;
    --accent:#C7E85B; --accent-soft:#283219; --accent-text:#C7E85B; --on-accent:#171B2E;
    --primary:#C7E85B; --primary-hover:#D6EF82; --on-primary:#171B2E;
    --danger:#F19A8C; --danger-soft:#3A1E1A; --warn:#F2C27B; --warn-soft:#33270F;
    --focus:#C7E85B; --scrim:rgba(0,0,0,.6);
    --brand-dark:#F7F7F2; --brand-light:#8A90A2; --brand-ring:#F7F7F2; --brand-ring-op:.45; --brand-node-stroke:#171B2E;
    --shadow-1:0 1px 2px rgba(0,0,0,.4); --shadow-2:0 2px 6px rgba(0,0,0,.35),0 14px 36px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-text="large"]{ --fs-body:19px; --fs-small:17px; --fs-caption:15px; --fs-read:21px; --fs-h3:20px; --fs-h2:24px; }

/* ---------- nền tảng ---------- */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:var(--fs-body);line-height:1.55;
  -webkit-font-smoothing:antialiased;overflow-wrap:anywhere}
h1,h2,h3,h4{line-height:1.22;margin:0 0 var(--s2);letter-spacing:-.01em}
h1{font-size:var(--fs-h1);font-weight:800} h2{font-size:var(--fs-h2);font-weight:700} h3{font-size:var(--fs-h3);font-weight:700} h4{font-size:var(--fs-small);font-weight:700}
p{margin:0 0 var(--s3)}
a{color:inherit;text-decoration-thickness:1px;text-underline-offset:3px}
button,input,select,textarea{font:inherit;color:inherit}
img,svg{display:block}
:focus{outline:none}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:absolute;left:-9999px;top:8px;z-index:100;background:var(--surface);color:var(--text);padding:12px 16px;border-radius:var(--r-sm);box-shadow:var(--shadow-2)}
.skip:focus{left:12px}
.muted{color:var(--text-2)} .small{font-size:var(--fs-small)} .caption{font-size:var(--fs-caption);color:var(--text-2)}
.eyebrow{font-size:var(--fs-caption);font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-2);margin:0 0 var(--s2)}
.stack>*+*{margin-top:var(--s3)} .stack-lg>*+*{margin-top:var(--s6)}
.row{display:flex;gap:var(--s3);align-items:center;flex-wrap:wrap} .row.between{justify-content:space-between} .grow{flex:1;min-width:0}
.hr{height:1px;background:var(--border);border:0;margin:var(--s5) 0}
.num{font-variant-numeric:tabular-nums}

/* ---------- thương hiệu & icon ---------- */
.b-dark{fill:var(--brand-dark)} .b-light{fill:var(--brand-light)} .b-north{fill:var(--brand-north)}
.b-ring{stroke:var(--brand-ring);stroke-opacity:var(--brand-ring-op)} .b-node{fill:var(--brand-node);stroke:var(--brand-node-stroke)}
.logo{display:inline-flex;align-items:center;gap:0;color:var(--text);text-decoration:none}
.logo svg{flex:none}
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic .acc{fill:var(--accent);stroke:currentColor} .ic.mono .acc{fill:currentColor}
.ic.sm{width:18px;height:18px} .ic.lg{width:32px;height:32px} .ic.xl{width:64px;height:64px;stroke-width:1.6}
.icon-tile{display:inline-flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:var(--r-md);background:var(--accent-soft);color:var(--text);flex:none}
.icon-tile.dark{background:var(--ink-900);color:#F7F7F2}

/* ---------- nút ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);min-height:var(--tap);padding:10px 18px;border-radius:var(--r-sm);
  border:1px solid transparent;background:var(--primary);color:var(--on-primary);font-weight:650;font-size:var(--fs-small);line-height:1.2;cursor:pointer;

/* ---------- ô nhập ---------- */

  font-size:max(16px,var(--fs-small));transition:border-color var(--dur-1) var(--ease),box-shadow var(--dur-1) var(--ease)}

/* ---------- khối ---------- */

.note b{font-weight:700}

/* ---------- huy hiệu, tiến độ, năng lực ---------- */

  background:var(--sunk);color:var(--text)}
.badge.live{background:var(--accent);color:var(--on-accent)} .badge.preview{background:transparent;border:1px solid var(--text)} .badge.planned{background:transparent;border:1px dashed var(--text-2);color:var(--text-2);font-weight:500}
.badge.ok{background:var(--accent-soft);color:var(--accent-text)} .badge.warn{background:var(--warn-soft);color:var(--warn)} .badge.danger{background:var(--danger-soft);color:var(--danger)}

.meter i.on{background:var(--ink-700);border-color:var(--ink-700)} .meter i.on.top{background:var(--accent);border-color:var(--ink-700)}

/* ---------- tab, đường dẫn, gợi ý ---------- */

.tab:hover{color:var(--text)}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:var(--fs-caption);color:var(--text-2);margin-bottom:var(--s3)}
.crumbs a{color:var(--text-2);text-decoration:none;min-height:32px;display:inline-flex;align-items:center} .crumbs a:hover{color:var(--text);text-decoration:underline}
.crumbs .sep{opacity:.6}

/* ---------- hộp thoại, ngăn kéo, thông báo ---------- */
.scrim{position:fixed;top:0;right:0;bottom:0;left:0;background:var(--scrim);z-index:60;display:flex;align-items:center;justify-content:center;padding:var(--s4);animation:fade var(--dur-2) var(--ease)}
.dialog{background:var(--surface);color:var(--text);border-radius:var(--r-lg);box-shadow:var(--shadow-2);width:min(560px,100%);max-height:min(86vh,760px);overflow:auto;padding:var(--s6);animation:rise var(--dur-2) var(--ease)}

.drawer-panel{background:var(--surface);width:min(420px,92vw);height:100%;overflow:auto;padding:var(--s5);box-shadow:var(--shadow-2);animation:slidein var(--dur-2) var(--ease);
  padding-top:max(var(--s5),env(safe-area-inset-top));padding-bottom:max(var(--s5),env(safe-area-inset-bottom))}

@keyframes fade{from{opacity:0}to{opacity:1}} @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes slidein{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}

/* ---------- trạng thái tải, trống, lỗi ---------- */

/* ---------- khung app ---------- */

.main{flex:1;min-width:0;display:flex;flex-direction:column}

  background:var(--bg);background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:saturate(1.4) blur(12px);backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--border)}

  padding:4px 6px calc(4px + env(safe-area-inset-bottom));justify-content:space-around}
.tabbar a,.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:54px;color:var(--text-2);text-decoration:none;
  font-size:11px;font-weight:650;border:0;background:none;border-radius:var(--r-sm);cursor:pointer;position:relative}
.tabbar a[aria-current="page"]{color:var(--text)} .tabbar a[aria-current="page"] .ic{color:var(--text)}
.tabbar a[aria-current="page"]::before{content:"";position:absolute;top:0;width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}

@media (max-width:1099px){

}
@media (min-width:1100px){ .toasts{bottom:24px} }
@media (max-width:520px){ .content{padding-left:var(--s4);padding-right:var(--s4)} .card{padding:var(--s4)} }

/* ---------- trang ---------- */
.page-head{display:flex;gap:var(--s4);align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:var(--s6)}

.grid{display:grid;gap:var(--s4)}

.grid.three{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}

/* Cánh cửa học viện */
.doors{display:grid;gap:var(--s3);grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.door{position:relative;display:flex;flex-direction:column;gap:var(--s2);min-height:210px;padding:var(--s5) var(--s4) var(--s4);border-radius:90px 90px var(--r-md) var(--r-md);
  background:var(--surface);border:1px solid var(--border);text-decoration:none;color:inherit;transition:transform var(--dur-2) var(--ease),box-shadow var(--dur-2) var(--ease),border-color var(--dur-2) var(--ease);overflow:hidden}

.toc-side{display:none;position:sticky;top:24px;align-self:start;max-height:calc(100vh - 48px);overflow:auto}
.toc a{display:block;padding:6px 10px;border-left:2px solid var(--border);color:var(--text-2);text-decoration:none;font-size:var(--fs-caption);min-height:32px}
.toc a:hover{color:var(--text);border-color:var(--text-2)} .toc a.done{color:var(--text)} .toc a.done::after{content:" ✓";color:var(--accent-text)}

.quiz-q{font-weight:650;margin-bottom:var(--s3)}
.opt{display:flex;gap:var(--s3);align-items:flex-start;width:100%;min-height:var(--tap);padding:12px 14px;margin-top:8px;border:1px solid var(--border-strong);border-radius:var(--r-sm);background:var(--surface);cursor:pointer;text-align:left;line-height:1.45}
.opt:hover{border-color:var(--text-2)}

.opt[aria-checked="true"]{border-color:var(--text);box-shadow:0 0 0 2px var(--text) inset}
.opt.right{border-color:var(--accent-text);background:var(--accent-soft)} .opt.right .key{background:var(--accent);border-color:var(--accent-text);color:var(--on-accent)}
.opt.wrong{border-color:var(--danger);background:var(--danger-soft)} .opt.wrong .key{background:var(--danger);border-color:var(--danger);color:#fff}

.term{display:grid;grid-template-columns:minmax(120px,200px) 1fr;gap:var(--s3);padding:10px 0;border-top:1px solid var(--border);font-size:var(--fs-small)}
@media (max-width:520px){.term{grid-template-columns:1fr;gap:4px}}

/* Minh hoạ */
.illo{width:100%;height:auto}

.lpath-wrap{container-type:inline-size}

.lpath::before{content:"";position:absolute;left:10%;right:10%;top:17px;border-top:3px dotted var(--border-strong)}
.lpath li{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:0 4px}
.lpath .dot{width:36px;height:36px;border-radius:50%;border:2px solid var(--text);background:var(--surface);display:flex;align-items:center;justify-content:center;position:relative;z-index:1;color:var(--ink-900)}
.lpath li.done .dot{background:var(--accent)} .lpath li.cur .dot{background:var(--accent);box-shadow:0 0 0 6px var(--accent-soft)}
.lpath .lv{font-weight:700;font-size:var(--fs-small)} .lpath .en{font-size:var(--fs-caption);color:var(--text-2)}
@media (max-width:560px){.lpath{grid-template-columns:1fr;gap:12px}.lpath::before{left:17px;right:auto;top:18px;bottom:18px;border-top:0;border-left:3px dotted var(--border-strong)}
  .lpath li{flex-direction:row;text-align:left;gap:12px}}
@container (max-width:560px){.lpath{grid-template-columns:1fr;gap:12px}.lpath::before{left:17px;right:auto;top:18px;bottom:18px;border-top:0;border-left:3px dotted var(--border-strong)}
  .lpath li{flex-direction:row;text-align:left;gap:12px}}
.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.flow .step{padding:10px 14px;border:1.5px solid var(--text);border-radius:12px;background:var(--surface);font-weight:650;font-size:var(--fs-small)}
.flow .step.last{background:var(--accent);color:var(--on-accent)} .flow .arr{color:var(--text-2)}
/* Design system page */
.swatch{border-radius:var(--r-sm);border:1px solid var(--border);overflow:hidden;font-size:var(--fs-caption)}
.swatch .chip{height:64px} .swatch .meta{padding:8px 10px;background:var(--surface)}
.spec{display:grid;gap:var(--s3);grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.demo-row{display:flex;flex-wrap:wrap;gap:var(--s3);align-items:center}
.state-label{font-size:11px;color:var(--text-2);text-align:center;margin-top:4px}
.force-hover.btn{background:var(--primary-hover)} .force-hover.btn.secondary{background:var(--surface-2);border-color:var(--text-2)}
.force-hover.btn.ghost{background:var(--sunk)} .force-hover.btn.accent{background:var(--lime-200)} .force-hover.btn.danger{background:var(--danger);filter:brightness(1.08)}
.force-focus{outline:3px solid var(--focus);outline-offset:2px}
.force-active{transform:translateY(1px) scale(.99)}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
}
:root[data-motion="reduce"] *,:root[data-motion="reduce"] *::before,:root[data-motion="reduce"] *::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}

      h('span', { 'class': 'no', 'aria-hidden': 'true', text: String(a.no) }),
      h('span', { 'class': 'icon-tile' }, [icon('i-' + a.id, { cls: 'lg' })]),
      h('span', { 'class': 'name', text: UI.illo.shortName(a) }),
      h('span', { 'class': 'sub', text: info.sub || a.name }),
      h('span', { 'class': 'foot' }, [info.meter || null, info.progress || null])
    ]);
  }
  UI.door = door;

  /* ---------- Dữ liệu ATLAS cũ: kiểm tra chỉ đọc + tải sao lưu (từ Phase 1) ---------- */
  function download(name, text, type) {
    var blob = new Blob([text], { type: type || 'application/json;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = h('a', { href: url, download: name });
    doc.body.appendChild(a); a.click(); doc.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 10000);
  }
  UI.download = download;
  function rows(list) {
    var trs = [];
    each(list, function (r) { if (r) trs.push(h('tr', null, [h('th', { scope: 'row', text: r[0] }), h('td', { text: String(r[1]) })])); });
    return h('table', { 'class': 'kv' }, [h('tbody', null, trs)]);
  }
  UI.kvTable = rows;
  UI.legacyPanel = function () {
    var store = UI.store, nodes = [UI.note('ok', 'Phần này chỉ đọc dữ liệu ATLAS cũ: không ghi, không xoá gì.')];
    if (!store.available) { nodes.push(UI.note('warn', 'Trình duyệt đang chặn bộ nhớ (có thể đang ở chế độ duyệt riêng tư), nên không đọc được dữ liệu cũ.')); return h('div', { 'class': 'stack' }, nodes); }
    var plan = A.planMigration(store, UI.content, Date.now()), L = plan.legacy;
    if (!L.present) {
      nodes.push(h('p', { text: 'Máy này chưa có dữ liệu ATLAS cũ.' }));
      nodes.push(h('p', { 'class': 'muted', text: 'Dữ liệu cũ nằm trong trình duyệt của chiếc máy đã dùng ATLAS cũ, cùng địa chỉ fpltraining.github.io.' }));
    } else if (L.error) {
      nodes.push(UI.note('warn', L.error));
      nodes.push(UI.btn('Tải bản gốc (dạng thô)', { kind: 'secondary', icon: 'download', onClick: function () { download('atlas-du-lieu-cu-tho-' + A.vnDay(Date.now()) + '.txt', L.raw, 'text/plain;charset=utf-8'); } }));
    } else {
      var s = plan.summary, g = s.language;
      nodes.push(rows([['Bài đã hoàn thành', s.completions], ['Bài có lịch ôn', s.reviews], ['Lượt ôn đã ghi', s.attempts], ['Dự đoán và phép thử', s.commitments],
        ['Dự án', s.projects], ['Ghi chép (Sổ tư duy)', s.notes], ['Tài sản / khoản nợ', s.assets + ' / ' + s.debts], s.otherRecords ? ['Mục khác', s.otherRecords] : null,
        ['Ngày có nhật ký học', s.journalDays], ['Đánh giá đầu vào', s.entryAssessment ? 'Đã làm' : 'Chưa làm'],
        ['Lần lưu cuối', L.updatedAt ? A.vnLabel(L.updatedAt) + ' (giờ VN)' : 'Không rõ'], ['Dung lượng', UI.kb(L.bytes)]]));
      nodes.push(h('p', { 'class': 'muted small', text: 'Phần ngoại ngữ không chuyển sang ATLAS mới: thẻ từ ' + g.wordCards + ' · thẻ câu ' + g.sentCards + ' · từ tự thêm ' + g.customWords +
        ' · trang viết tay ' + g.notebooks + ' · lượt luyện viết ' + g.writingEvents + '. Phần này vẫn nguyên trong ATLAS cũ và trong file sao lưu.' }));
      nodes.push(UI.btn('Tải file sao lưu dữ liệu cũ', { icon: 'download', onClick: function () { var t = Date.now(); download(A.legacyBackupName(t), A.legacyBackupJson(L, t)); } }));
      nodes.push(h('p', { 'class': 'caption', text: 'Khôi phục được bằng ATLAS cũ: Hồ sơ → Khôi phục từ tệp sao lưu.' }));
    }
    var u = store.usage();
    nodes.push(h('p', { 'class': 'caption', text: 'Bộ nhớ trình duyệt dùng chung cho mọi app trên fpltraining.github.io: khoảng ' + UI.kb(u.bytes) + ' (' + u.keys + ' khoá).' }));
    return h('div', { 'class': 'stack' }, nodes);
  };
  function pageLegacy() {
    return h('div', null, [UI.crumbs([{ label: 'Hồ sơ & dữ liệu', href: '#/settings' }, { label: 'Dữ liệu ATLAS cũ' }]),
      UI.pageHead('Dữ liệu ATLAS cũ', { lead: 'Kiểm tra dữ liệu của bản ATLAS trước (8 lĩnh vực) trên máy này và tải file sao lưu.' }),
      UI.card(UI.legacyPanel())]);
  }

  UI.route('design', pageDesign, { title: 'Bộ nhận diện', nav: '' });
  UI.route('settings/legacy', pageLegacy, { title: 'Dữ liệu ATLAS cũ', nav: 'settings', narrow: true });
})(window);

</script>
<script id="atlas-ui-interim">
/* Trang chủ tạm của Phase 2 (Phase 3 thay bằng Tổng quan thật). ES5. */
(function (root) {
  'use strict';
  var UI = root.UI, h = UI.h;
  UI.route('', function () {
    var c = UI.content;
    return h('div', null, [
      UI.pageHead('ATLAS đang được xây', { eyebrow: 'Bản đang xây · Phase 2', lead: 'Giao diện học tập sẽ có ở Phase 3. Trong lúc chờ, anh xem bộ nhận diện và kiểm tra dữ liệu ATLAS cũ.' }),
      h('div', { 'class': 'hero' }, [h('div', { 'class': 'stack' }, [h('h2', { text: 'Đại học cá nhân với 7 học viện' }),
        h('p', { 'class': 'muted', text: 'Learn → Recall → Explain → Apply → Build → Reflect → Master.' }),
        h('div', { 'class': 'row' }, [UI.btn('Xem bộ nhận diện', { href: '#/design', icon: 'spark' }), UI.btn('Dữ liệu ATLAS cũ', { href: '#/settings/legacy', kind: 'secondary', icon: 'download' })])]),
        UI.illo.hero(c)]),
      UI.section('Trạng thái tính năng', UI.card(h('table', { 'class': 'kv' }, [h('tbody', null, c.features.map(function (f) {
        return h('tr', null, [h('th', { scope: 'row', text: f.name + ' · Phase ' + f.phase }), h('td', null, [UI.statusBadge(f.status)])]);
      }))])))
    ]);
  }, { title: 'Đang xây', nav: 'home' });
})(window);

</script>
<script id="atlas-ui-boot">
/* atlas-ui-boot: khởi động app. ES5. */
(function (root) {
  'use strict';
  var UI = root.UI, A = root.ATLAS, h = UI.h, doc = root.document;

  function fatal(msg) {
    var app = doc.getElementById('app');
    UI.replace(app, h('div', { 'class': 'content narrow' }, [h('h1', { text: 'ATLAS chưa mở được' }), UI.errorBox(msg + ' Dữ liệu học trên máy không bị ảnh hưởng.')]));
  }

  try {
    UI.content = A.readContent(doc);
    UI.contentProblems = A.checkContent(UI.content);
  } catch (e) { fatal('Không đọc được khối nội dung: ' + e.message + '.'); return; }

  var backend = null;
  try { backend = root.localStorage; backend.getItem(A.KEYS.state); } catch (e) { backend = null; }
  UI.store = A.storage(backend);
  UI.loadInfo = A.loadState(UI.store, Date.now());
  if (UI.loadInfo.source === 'new') UI.state = UI.loadInfo.state;
  UI.applyPrefs();
  UI.mountShell();

  UI.route('__404', function () {
    return h('div', null, [UI.pageHead('Không tìm thấy trang', { lead: 'Địa chỉ này không có trong ATLAS.' }), UI.btn('Về Tổng quan', { href: '#/', icon: 'home' })]);
  }, { title: 'Không tìm thấy' });

  if (UI.onBoot) UI.onBoot();
  UI.render();
  UI.booted = true;
})(window);

</script>
</body>
