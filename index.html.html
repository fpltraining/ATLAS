<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ATLAS">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230e130d'/%3E%3Ctext x='50' y='68' font-size='58' text-anchor='middle'%3E🧭%3C/text%3E%3C/svg%3E">
<title>ATLAS</title>
<style>
:root{
 --bg:#0e130d; --panel:#161d14; --panel2:#1b2418; --line:#2a3625; --text:#eef2ea; --muted:#9fae95;
 --lime:#d8f36a; --lime-dark:#9fb84a; --danger:#e26a5a; --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
body{padding-bottom:env(safe-area-inset-bottom,0px);}
a{color:var(--lime)}
button{font-family:inherit;cursor:pointer}
input,textarea,select{font-family:inherit;background:#0f150d;border:1px solid var(--line);color:var(--text);border-radius:9px;padding:10px 12px;width:100%;font-size:16px}
textarea{resize:vertical;min-height:80px}
.eyebrow{font-size:11px;letter-spacing:.08em;color:var(--lime-dark);font-weight:700;margin:0 0 6px}
.muted{color:var(--muted)}
.lime{color:var(--lime)}
h1,h2,h3{margin:0 0 6px;line-height:1.25}
p{margin:0 0 10px;line-height:1.55}
.small-label{font-size:12px;color:var(--muted);display:block;margin-bottom:6px}
.field-label{font-size:13px;color:var(--text);display:block;margin-bottom:6px;font-weight:600}
.field-help{font-size:12px;color:var(--muted);margin-top:4px}
.reference-note{font-size:12px;color:var(--muted);border-left:2px solid var(--line);padding-left:10px;margin:10px 0}
.save-error{color:var(--danger);font-size:13px}
/* layout */
#app{display:flex;min-height:100vh}
.sidebar{width:220px;flex:0 0 220px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 14px;position:sticky;top:0;height:100vh}
.sidebar .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:.05em;margin-bottom:22px;color:var(--lime)}
.sidebar nav{flex:1;display:flex;flex-direction:column;gap:4px}
.navlink{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;border:none;background:transparent;color:var(--text);text-align:left;font-size:14px}
.navlink.active{background:var(--panel2);color:var(--lime);font-weight:700}
.navlink:hover{background:var(--panel2)}
.sidebar-footer{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
.profile-btn{display:flex;align-items:center;gap:10px;width:100%;background:transparent;border:1px solid var(--line);border-radius:12px;padding:10px;color:var(--text)}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--lime);color:#0e130d;font-weight:800;display:flex;align-items:center;justify-content:center;flex:0 0 30px}
.profile-btn small{display:block;color:var(--muted);font-weight:400}
main{flex:1;min-width:0}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5;gap:10px;flex-wrap:wrap}
.topbar .crumbs{font-size:14px;color:var(--muted)}
.topbar .crumbs b{color:var(--text)}
.workspace{padding:22px;max-width:1100px}
.page-title{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.page-title h1{font-size:26px}
.btn{background:var(--lime);color:#0e130d;border:none;border-radius:10px;padding:10px 16px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.btn.outline{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.ghost{background:transparent;color:var(--text);border:none}
.btn.danger{background:var(--danger);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:16px}
.grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:16px}
@media (max-width:820px){.grid2{grid-template-columns:1fr}#app{flex-direction:column}.sidebar{position:relative;width:100%;flex:none;height:auto;flex-direction:row;align-items:center;overflow-x:auto}.sidebar nav{flex-direction:row}.sidebar .brand{margin:0 10px 0 0}.sidebar-footer{display:none}}
.today-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;margin-bottom:20px}
@media (max-width:820px){.today-grid{grid-template-columns:1fr}}
.spotlight{background:linear-gradient(160deg,#1c2617,var(--panel));border:1px solid var(--line);border-radius:var(--radius);padding:22px;display:flex;flex-direction:column;gap:12px}
.mini-pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.05em;color:var(--lime);background:#26311d;padding:4px 10px;border-radius:99px}
.progress{height:8px;background:#26311d;border-radius:99px;overflow:hidden}
.progress > div{height:100%;background:var(--lime)}
.step-card{display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:left;color:var(--text);width:100%}
.step-card span:first-child{font-weight:800;color:var(--lime-dark);font-size:18px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px}
@media (max-width:820px){.steps{grid-template-columns:1fr}}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
.tab{background:transparent;border:none;color:var(--muted);padding:10px 14px;font-size:14px;border-bottom:2px solid transparent}
.tab.active{color:var(--lime);border-color:var(--lime);font-weight:700}
.lesson-row{display:flex;align-items:center;gap:12px;width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:8px;color:var(--text);text-align:left}
.lesson-row small{display:block;color:var(--muted);font-weight:400}
.lesson-num{width:26px;height:26px;border-radius:50%;background:#26311d;display:flex;align-items:center;justify-content:center;font-size:12px;flex:0 0 26px}
.curriculum-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.domain-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.card-header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.project-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:14px}
.card-meta{font-size:12px;color:var(--muted)}
.stage-dots{display:flex;gap:5px;margin:10px 0}
.stage-dots span{height:6px;flex:1;border-radius:99px;background:#26311d}
.stage-dots span.filled{background:var(--lime)}
.subtle-panel{background:#141a12;border:1px dashed var(--line);border-radius:12px;padding:14px}
.asset-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}
@media (max-width:700px){.asset-summary{grid-template-columns:1fr}}
.asset-summary > div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.money-number{font-size:22px;font-weight:800}
.asset-row{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.asset-row strong{margin-left:auto}
.icon-btn{background:transparent;border:none;color:var(--muted);padding:6px;border-radius:8px}
.icon-btn:hover{background:#26311d;color:var(--text)}
.empty-panel{text-align:center;padding:40px 20px;border:1px dashed var(--line);border-radius:var(--radius);background:var(--panel)}
.form-grid{display:flex;flex-direction:column;gap:14px}
.form-pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.radio-option{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.radio-option input{width:auto}
.feedback{background:#1b2418;border:1px solid var(--lime-dark);border-radius:10px;padding:12px;margin-top:12px;font-size:14px}
.feedback.incorrect{border-color:var(--danger)}
/* modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-start;justify-content:center;padding:30px 14px;overflow-y:auto;z-index:50}
.dialog{background:var(--panel);border:1px solid var(--line);border-radius:16px;max-width:640px;width:100%;padding:24px;margin:auto}
.dialog-close{position:sticky;top:0;float:right;background:transparent;border:none;color:var(--muted);font-size:20px}
.status-badge{display:inline-block;font-size:11px;font-weight:700;background:#26311d;color:var(--lime);padding:4px 9px;border-radius:99px}
.status-badge.due{background:#3a2718;color:#f0a267}
.commitment-card details{margin-top:10px}
.commitment-card summary{cursor:pointer;color:var(--muted);font-size:13px}
.loading-label{color:var(--muted)}
.error-banner{background:#3a1e1a;border:1px solid var(--danger);border-radius:10px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.auth-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px;max-width:380px;width:100%}
.day-chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:8px 14px;font-size:13px;color:var(--text)}
.footer-note{color:var(--muted);font-size:12px;text-align:center;padding:30px 0}
svg.chart{width:100%;height:110px}
.sync-badge{display:block;text-align:center;font-size:11px;color:var(--muted);margin-top:8px}
.lang-toggle{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:3px;gap:2px}
.lang-btn{background:transparent;border:none;color:var(--muted);padding:6px 12px;border-radius:99px;font-size:12px;font-weight:700}
.lang-btn.active{background:var(--lime);color:#0e130d}
.bi-block{margin-bottom:10px}
.bi-vi{color:var(--text)}
.bi-en{color:var(--lime);margin-top:2px}
.bi-en.hidden-tr{display:none}
.vocab-card{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;display:flex;align-items:center;gap:10px}
.vocab-card b{color:var(--lime)}
.speak-btn{background:transparent;border:1px solid var(--line);border-radius:8px;color:var(--text);padding:5px 8px;font-size:13px}
.listen-row{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:6px}
.ink-toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.ink-canvas-wrap{background:#fdfaf1;border-radius:12px;overflow:hidden;border:1px solid var(--line);touch-action:none}
.ink-canvas-wrap canvas{display:block;width:100%;touch-action:none}
.swatch{width:22px;height:22px;border-radius:50%;border:2px solid transparent;cursor:pointer}
.swatch.active{border-color:var(--lime)}
.session-item{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.session-item.done{opacity:.55;text-decoration:line-through}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
/* ============================================================
 * ATLAS — single-file port (ES6, Supabase persistence)
 * Cấu hình: điền URL + anon key Supabase của Han bên dưới.
 * SQL cần chạy 1 lần trong Supabase SQL editor:
 *
 * create table if not exists atlas_state (
 *   user_id uuid primary key references auth.users(id) on delete cascade,
 *   data jsonb not null default '{}'::jsonb,
 *   updated_at timestamptz not null default now()
 * );
 * alter table atlas_state enable row level security;
 * create policy "own state" on atlas_state for all
 *   using (auth.uid() = user_id) with check (auth.uid() = user_id);
 * ============================================================ */
const SUPABASE_URL = 'https://YOUR-PROJECT.supabase.co';
const SUPABASE_ANON_KEY = 'YOUR-ANON-KEY';
/* Nếu chưa điền key, hoặc thư viện Supabase không tải được (mất mạng, CDN bị chặn),
 * app vẫn chạy bình thường ở chế độ lưu trên máy — không crash. */
const SUPABASE_CONFIGURED = !/YOUR-PROJECT|YOUR-ANON-KEY/.test(SUPABASE_URL+SUPABASE_ANON_KEY) && !!(window.supabase && window.supabase.createClient);

const sb = SUPABASE_CONFIGURED ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
const LOCAL_KEY = 'atlas_local_state_v1';

/* ---------------- Vietnam timestamp helper ---------------- */
function vnNow(){ return new Date(Date.now() + 7*3600*1000); }
function localDay(now){ now = now || vnNow(); return `${now.getUTCFullYear()}-${String(now.getUTCMonth()+1).padStart(2,'0')}-${String(now.getUTCDate()).padStart(2,'0')}`; }
function displayDate(v){ const d = new Date(v.length===10 ? v+'T12:00:00' : v); return d.toLocaleDateString('vi-VN',{day:'numeric',month:'numeric',year:'numeric'}); }
function money(v){ return new Intl.NumberFormat('vi-VN',{maximumFractionDigits:0}).format(v); }
function number(v){ return new Intl.NumberFormat('vi-VN',{maximumFractionDigits:2}).format(v); }
function uid(){ return crypto.randomUUID(); }

/* ---------------- Curriculum data (24 lessons) ---------------- */
const domains = [
 {id:'money',name:'Tiền & giá trị',short:'Tài chính',icon:'💰',color:'#d8f36a',description:'Hiểu tiền trước khi tìm cách kiếm nhiều hơn.',source:'https://www.oecd.org/en/topics/sub-issues/financial-education.html',sourceName:'OECD · Giáo dục tài chính'},
 {id:'thinking',name:'Tư duy & học tập',short:'Tư duy',icon:'🧠',color:'#afbded',description:'Học cách hiểu, kiểm chứng và tự sửa sai.',source:'https://openstax.org/details/books/psychology-2e',sourceName:'OpenStax · Psychology 2e'},
 {id:'world',name:'Kinh tế & thế giới',short:'Thế giới',icon:'🌍',color:'#83c6ce',description:'Nhìn những mối liên hệ phía sau sự kiện.',source:'https://openstax.org/details/books/principles-economics-3e',sourceName:'OpenStax · Principles of Economics 3e'},
 {id:'technology',name:'Khoa học & công nghệ',short:'Công nghệ',icon:'💻',color:'#c7a2d9',description:'Hiểu công cụ, dữ liệu và cách thử một giả thuyết.',source:'https://www.nist.gov/itl/ai-risk-management-framework',sourceName:'NIST · AI Risk Management Framework'},
 {id:'business',name:'Xây doanh nghiệp',short:'Kinh doanh',icon:'📦',color:'#d9b882',description:'Từ một vấn đề thật đến một giải pháp có người dùng.',source:'https://openstax.org/details/books/entrepreneurship',sourceName:'OpenStax · Entrepreneurship'},
 {id:'leadership',name:'Con người & lãnh đạo',short:'Lãnh đạo',icon:'👥',color:'#dba59b',description:'Lắng nghe, phối hợp và xây tổ chức.',source:'https://openstax.org/details/books/principles-management',sourceName:'OpenStax · Principles of Management'},
 {id:'decisions',name:'Quyết định & chiến lược',short:'Quyết định',icon:'🧭',color:'#a3c49a',description:'Chọn việc đáng làm và biết khi nào cần đổi hướng.',source:'https://openstax.org/details/books/principles-management',sourceName:'OpenStax · Principles of Management'},
 {id:'life',name:'Sống tốt & di sản',short:'Sống tốt',icon:'❤️',color:'#ccb992',description:'Xác định điều mình muốn xây và gìn giữ.',source:'https://openstax.org/details/books/introduction-philosophy',sourceName:'OpenStax · Introduction to Philosophy'},
];
const make=(id,domain,title,summary,paragraphs,simple,example,task,question,options,correct,explanation)=>({id,domain,title,summary,paragraphs,simple,example,task,question,options,correct,explanation,minutes:5});
const lessons=[
make('money-1','money','Tiền đến từ đâu?','Bắt đầu với giá trị và sự trao đổi.',[
'Trong một giao dịch, người mua thường trả tiền để nhận một lợi ích: tiết kiệm thời gian, giải quyết một vấn đề hoặc có một trải nghiệm họ muốn.',
'Tạo giá trị là làm điều hữu ích cho ai đó. Để có doanh thu, người đó còn cần biết đến giải pháp, có khả năng chi trả và quyết định mua. Hữu ích không tự động đồng nghĩa với có lợi nhuận.',
'Bước đầu của người làm kinh doanh là quan sát: ai đang gặp khó khăn, họ đang giải quyết ra sao, và mình có thể giúp tốt hơn ở điểm nào?'],
'Anh giúp ai đó giải quyết một việc họ cần. Nếu họ đồng ý trả tiền, sự trao đổi tạo ra doanh thu cho anh.',
'Ví dụ giả định: một người bận trả 50.000đ để được giao đồ ăn. Họ mua cả món ăn lẫn thời gian tiết kiệm. Người bán vẫn phải trừ nguyên liệu, giao hàng và các chi phí khác.',
'Viết một vấn đề anh thấy quanh mình, người gặp vấn đề đó và cách họ đang xử lý.',
'Điều gì nên được kiểm chứng đầu tiên khi có ý tưởng kinh doanh?',
['Logo có đủ đẹp không?','Có ai gặp vấn đề này và muốn giải quyết không?','Có thể thuê bao nhiêu nhân viên?'],1,'Nhu cầu thật là điểm bắt đầu. Logo và nhân sự chưa chứng minh được ai cần giải pháp.'),
make('money-2','money','Doanh thu chưa phải lợi nhuận','Phân biệt ba con số cơ bản.',[
'Doanh thu là tổng tiền bán hàng ghi nhận trong kỳ. Chi phí là nguồn lực đã dùng cho hoạt động đó. Lợi nhuận được tính bằng doanh thu trừ các chi phí tương ứng.',
'Dòng tiền là tiền thực sự vào và ra. Khách mua nhưng chưa thanh toán có thể tạo doanh thu trong sổ sách trong khi tài khoản chưa nhận tiền.',
'Để hiểu một hoạt động kinh doanh, hãy xem cả lợi nhuận và dòng tiền. Ghi rõ kỳ thời gian và những khoản chi đã tính.'],
'Bán được nhiều tiền chưa có nghĩa còn lại nhiều tiền. Hãy trừ đủ chi phí và kiểm tra tiền đã về chưa.',
'Ví dụ: bán 100 phần giá 30.000đ được 3.000.000đ. Nếu tổng chi phí của kỳ là 2.400.000đ, lợi nhuận là 600.000đ. Đây là ví dụ đơn giản, giả sử đã tính đủ chi phí.',
'Chọn một sản phẩm giả định. Ghi giá bán, số lượng và tất cả chi phí anh nghĩ ra.',
'Doanh thu 5 triệu, tổng chi phí 4 triệu. Lợi nhuận là bao nhiêu?',
['5 triệu','4 triệu','1 triệu'],2,'5 triệu trừ 4 triệu bằng 1 triệu. Doanh thu là phần đầu vào của phép tính.'),
make('money-3','money','Tài sản ròng là gì?','Một bức ảnh về tình hình tài chính.',[
'Tài sản ròng bằng tổng giá trị tài sản trừ tổng nợ phải trả tại một thời điểm. Hãy dùng cùng một đơn vị tiền tệ khi cộng.',
'Giá trị tài sản có thể là ước tính. Tiền mặt dễ dùng ngay hơn một căn nhà hoặc phần sở hữu doanh nghiệp chưa có người mua.',
'Theo dõi tài sản ròng giúp thấy vị trí hiện tại. Khả năng trả các khoản đến hạn còn phụ thuộc dòng tiền và mức độ dễ chuyển tài sản thành tiền.'],
'Liệt kê những gì anh sở hữu, trừ những gì anh đang nợ. Con số còn lại là tài sản ròng ước tính.',
'Ví dụ: tiền gửi 50 triệu, tài sản khác 150 triệu, nợ 80 triệu. Tài sản ròng ước tính là 120 triệu; không có nghĩa anh có ngay 120 triệu tiền mặt.',
'Vào mục Tài sản, ghi khoản đầu tiên anh muốn theo dõi. Có thể dùng một ví dụ giả định để tập.',
'Tài sản 200 triệu và nợ 80 triệu thì tài sản ròng là?',
['120 triệu','200 triệu','280 triệu'],0,'Tài sản ròng = 200 − 80 = 120 triệu.'),
make('thinking-1','thinking','Biết mình chưa biết gì','Tách điều biết khỏi điều đang đoán.',[
'Một câu nói có thể chứa dữ kiện, suy luận và ý kiến. Dữ kiện cần có cách kiểm tra. Suy luận cần nêu rõ các giả định. Ý kiến thể hiện đánh giá hoặc sở thích.',
'Khi chưa biết, hãy biến sự mơ hồ thành câu hỏi cụ thể: mình cần hiểu từ nào, thiếu dữ liệu nào, ai có thể giúp kiểm chứng?',
'Hiểu sâu bắt đầu bằng việc nhận ra giới hạn của hiểu biết hiện tại.'],
'Tạo hai cột: điều đã kiểm tra và điều còn đang đoán. Đừng để hai cột lẫn vào nhau.',
'"Ba người bạn thích ý tưởng" là quan sát nhỏ. "Cả thị trường sẽ mua" là suy luận chưa được kiểm chứng.',
'Ghi một điều anh đang tin về việc kiếm tiền. Chỉ ra phần nào là dữ kiện và phần nào là giả định.',
'Ba người thích sản phẩm chứng minh điều gì?',
['Toàn bộ thị trường sẽ mua','Ba người đó đã bày tỏ sự thích thú','Sản phẩm chắc chắn có lãi'],1,'Mẫu quan sát nhỏ chỉ hỗ trợ kết luận giới hạn tương ứng.'),
make('thinking-2','thinking','Học để có thể giải thích','Tự diễn đạt là cách phát hiện chỗ chưa hiểu.',[
'Đọc một đoạn nhiều lần có thể khiến nó trở nên quen thuộc. Để kiểm tra hiểu biết, hãy đóng tài liệu và thử giải thích bằng lời của mình.',
'Nếu mắc ở đâu, quay lại phần đó. Sau đó làm một ví dụ khác, thay các con số hoặc bối cảnh.',
'Ôn lại sau một khoảng thời gian và nhận phản hồi giúp quá trình học có thêm cơ hội sửa sai.'],
'Học xong, thử kể lại cho một người mới bắt đầu. Chỗ nào anh chưa giải thích được là chỗ cần học thêm.',
'Sau bài lợi nhuận, tự đặt một tình huống bán hàng mới rồi tính. Đừng chỉ nhớ đáp án của ví dụ cũ.',
'Giải thích "lợi nhuận" trong hai câu như đang nói với một người chưa từng kinh doanh.',
'Cách nào kiểm tra khả năng áp dụng tốt hơn?',
['Đọc lại đáp án quen thuộc','Tự giải một ví dụ mới rồi đối chiếu','Chỉ đánh dấu đã đọc'],1,'Một ví dụ mới đòi hỏi anh áp dụng ý tưởng, đồng thời giúp phát hiện chỗ hiểu sai.'),
make('thinking-3','thinking','Tìm bằng chứng trái chiều','Thử làm người phản biện chính mình.',[
'Khi thích một ý tưởng, ta có thể chú ý nhiều đến thông tin ủng hộ và bỏ qua dấu hiệu bất lợi.',
'Hãy chủ động hỏi: trường hợp nào ý tưởng thất bại, ai đã thử mà không thành công, dữ liệu nào sẽ khiến mình thay đổi?',
'Ghi tiêu chí đổi ý trước khi biết kết quả giúp việc đánh giá rõ ràng hơn.'],
'Với mỗi lý do nói "nên làm", tìm một lý do đáng tin nói "cần xem lại".',
'Nếu tin khách thích giá rẻ, hãy hỏi cả những người chọn dịch vụ đắt hơn. Có thể họ ưu tiên độ tin cậy.',
'Chọn một ý tưởng. Viết bằng chứng nào sẽ khiến anh dừng thử nó.',
'Phản hồi tiêu cực đáng tin nên được xử lý ra sao?',
['Bỏ qua để giữ động lực','Kiểm tra xem nó thay đổi giả định nào','Kết luận mọi việc đều thất bại'],1,'Phản hồi là dữ liệu để xem lại giả định, không tự động phủ định toàn bộ dự án.'),
make('world-1','world','Cung, cầu và giá cả','Hiểu một cơ chế cơ bản của thị trường.',[
'Cầu mô tả lượng người mua muốn và có khả năng mua ở các mức giá. Cung mô tả lượng người bán sẵn sàng cung cấp ở các mức giá.',
'Khi nhu cầu tăng còn các điều kiện khác giữ nguyên, giá cân bằng có xu hướng tăng. Thực tế còn chịu ảnh hưởng bởi tồn kho, cạnh tranh, thời gian và quy định.',
'Một mô hình giúp nhìn cơ chế. Khi áp dụng, cần kiểm tra những điều kiện mà mô hình đang giả sử.'],
'Nhiều người muốn mua hơn trong khi hàng chưa tăng thường tạo áp lực tăng giá.',
'Ví dụ giả định: nhu cầu phòng tăng trong dịp lễ, nhưng số phòng không đổi ngay. Giá có thể tăng; mức tăng phụ thuộc cạnh tranh và lựa chọn thay thế.',
'Chọn một món hàng quen thuộc. Ghi hai điều có thể làm nhu cầu mua nó thay đổi.',
'Nếu cầu tăng và các điều kiện khác giữ nguyên, giá có xu hướng?',
['Tăng','Luôn bằng 0','Chắc chắn giảm'],0,'Trong mô hình cung cầu cơ bản, cầu tăng tạo áp lực tăng giá cân bằng.'),
make('world-2','world','Lạm phát và sức mua','Cùng một số tiền có thể mua được ít hơn.',[
'Lạm phát là sự tăng của mức giá chung theo thời gian. Giá một mặt hàng tăng riêng lẻ chưa đủ để kết luận về lạm phát chung.',
'Sức mua là lượng hàng hóa và dịch vụ mà tiền có thể mua. Nếu thu nhập tăng chậm hơn giá của những thứ anh mua, sức mua có thể giảm.',
'Khi đọc một số liệu, hãy xem quốc gia, kỳ thời gian, cách đo và nguồn công bố.'],
'Nếu giỏ hàng quen thuộc đắt lên mà tiền anh có không tăng tương ứng, anh mua được ít hơn.',
'Ví dụ giả định: giỏ hàng từ 100.000đ lên 105.000đ. Giá giỏ đó tăng 5%; một giỏ cá nhân không đại diện toàn bộ nền kinh tế.',
'Ghi ba khoản chi thường gặp. Anh sẽ cần dữ liệu nào để so sánh chúng theo thời gian?',
'Một món ăn tăng giá có đủ chứng minh mức lạm phát quốc gia không?',
['Có','Không, cần chỉ số giá có phạm vi phù hợp','Có nếu món đó phổ biến'],1,'Lạm phát chung được đo trên một phạm vi hàng hóa và dịch vụ, không từ một món riêng lẻ.'),
make('world-3','world','Nhìn một chuỗi giá trị','Tìm những mắt xích phía sau sản phẩm.',[
'Một sản phẩm thường đi qua nhiều hoạt động: nguyên liệu, sản xuất, vận chuyển, phân phối và dịch vụ sau bán.',
'Ở mỗi mắt xích, hãy hỏi ai là khách hàng, chi phí lớn ở đâu, điều gì đang bị chậm hoặc lãng phí.',
'Một cơ hội có thể nằm ở việc giúp một mắt xích hoạt động tốt hơn. Quy mô ngành lớn chưa đủ chứng minh cơ hội đó phù hợp với anh.'],
'Theo dấu một sản phẩm từ đầu đến tay người dùng. Tìm đoạn nào đang gặp khó khăn.',
'Một món hàng có thể bán chậm vì giao trễ hoặc mô tả khó hiểu. Hai vấn đề đó cần những giải pháp khác nhau.',
'Vẽ bằng chữ năm bước đưa một sản phẩm quen thuộc đến khách hàng. Chọn một bước cần tìm hiểu thêm.',
'Biết một ngành rất lớn đã đủ để quyết định tham gia chưa?',
['Đủ rồi','Chưa, cần hiểu nhu cầu và khả năng tiếp cận cụ thể','Chỉ cần có logo'],1,'Thị trường lớn là thông tin nền. Khách hàng, cạnh tranh và năng lực thực hiện vẫn phải được kiểm chứng.'),
make('technology-1','technology','Công nghệ tạo giá trị thế nào?','Bắt đầu từ công việc cần hoàn thành.',[
'Công nghệ là công cụ hoặc phương pháp giúp thực hiện một việc. Lợi ích có thể là giảm thời gian, giảm lỗi hoặc làm được việc trước đây khó làm.',
'Đánh giá công cụ bằng kết quả trước và sau khi dùng, bao gồm cả chi phí triển khai và thời gian học.',
'Một công cụ mới chỉ có ý nghĩa với mục tiêu của anh khi nó giải quyết một nhu cầu cụ thể.'],
'Hỏi "việc nào sẽ tốt hơn?" rồi đo thử, trước khi quyết định dùng rộng rãi.',
'Ví dụ: một mẫu biểu giảm thời gian ghi đơn từ 4 phút xuống 2 phút. Cần kiểm tra thêm lỗi và công sức bảo trì.',
'Chọn một việc lặp lại. Ghi thời gian hiện tại và cách anh sẽ đo một cải tiến.',
'Thước đo hữu ích nhất cho công cụ ghi đơn là?',
['Tên nghe hiện đại','Thời gian, lỗi và chi phí trước/sau','Số hiệu ứng đẹp'],1,'Đo kết quả giúp đánh giá lợi ích thực tế của công cụ.'),
make('technology-2','technology','AI có thể sai ở đâu?','Dùng AI cùng khả năng kiểm chứng.',[
'AI tạo sinh có thể viết câu trả lời trôi chảy nhưng chứa thông tin sai hoặc nguồn không tồn tại. Cách diễn đạt tự tin không chứng minh độ đúng.',
'Với thông tin quan trọng, hãy mở nguồn gốc, kiểm tra ngày và đối chiếu bằng chứng độc lập. Tránh đưa dữ liệu nhạy cảm vào dịch vụ chưa hiểu rõ.',
'Những quyết định có hậu quả lớn cần quy trình xem xét phù hợp và người có chuyên môn.'],
'Xem AI như người hỗ trợ soạn và phân tích. Kiểm tra điều quan trọng trước khi hành động.',
'Nếu AI nêu một quy định, hãy tìm văn bản chính thức còn hiệu lực. Không dùng một câu trả lời làm bằng chứng duy nhất.',
'Viết một việc anh muốn AI hỗ trợ và một bước kiểm tra kết quả trước khi dùng.',
'AI trả lời rất tự tin có nghĩa là?',
['Chắc chắn đúng','Vẫn cần kiểm chứng thông tin quan trọng','Không bao giờ cần nguồn'],1,'Sự trôi chảy và tự tin không bảo đảm tính chính xác.'),
make('technology-3','technology','Thử nghiệm một giả thuyết','Đặt câu hỏi có thể kiểm tra được.',[
'Giả thuyết là một nhận định có thể đem đối chiếu với quan sát. Hãy viết điều dự đoán và cách đo trước khi thử.',
'Khi so sánh hai phương án, cố gắng giữ những điều kiện liên quan tương đương. Nếu thay quá nhiều thứ, khó biết nguyên nhân của kết quả.',
'Một thử nghiệm nhỏ mang lại bằng chứng giới hạn. Ghi cả cỡ mẫu, thời gian và yếu tố gây nhiễu.'],
'Viết "nếu làm X, chỉ số Y sẽ thay đổi thế nào", rồi đo thử.',
'So hai cách giới thiệu sản phẩm cùng mức giá và nhóm khách tương tự sẽ dễ diễn giải hơn việc đổi cả giá, sản phẩm và kênh cùng lúc.',
'Viết một thử nghiệm nhỏ gồm giả thuyết, chỉ số và thời điểm xem lại.',
'Thay nhiều yếu tố cùng lúc gây khó khăn gì?',
['Khó biết yếu tố nào tạo kết quả','Luôn làm thử nghiệm tốt hơn','Không ảnh hưởng gì'],0,'Các yếu tố thay đổi cùng lúc có thể làm kết luận về nguyên nhân thiếu chắc chắn.'),
make('business-1','business','Bắt đầu từ một vấn đề','Gặp người có nhu cầu trước khi xây giải pháp.',[
'Mô tả khách hàng bằng bối cảnh cụ thể: họ đang làm gì, gặp khó khăn lúc nào và hậu quả ra sao.',
'Hỏi về lần gần nhất họ gặp vấn đề và cách họ đã xử lý. Câu chuyện thực tế thường hữu ích hơn câu hỏi "anh có thích ý tưởng không?".',
'Ghi lại nguyên văn phản hồi với sự đồng ý của người tham gia. Tách lời họ nói khỏi suy diễn của mình.'],
'Tìm hiểu một người đang cần gì, trước khi đoán họ sẽ mua gì.',
'"Lần gần nhất anh chờ giao hàng quá lâu là khi nào?" cụ thể hơn "Anh có muốn giao hàng tốt hơn không?".',
'Viết ba câu hỏi để hiểu vấn đề của một nhóm khách hàng anh muốn phục vụ.',
'Câu hỏi nào giúp thu thập trải nghiệm thật?',
['Bạn thấy ý tưởng của tôi tuyệt không?','Lần gần nhất gặp vấn đề đó, bạn làm gì?','Bạn có thể khen sản phẩm không?'],1,'Hỏi về hành vi đã xảy ra giúp giảm việc chỉ nhận những lời đồng tình.'),
make('business-2','business','Giải pháp nhỏ nhất để thử','Chọn một giả định cần kiểm chứng.',[
'Một bản thử nghiệm nên đủ để trả lời một câu hỏi quan trọng. Có thể là bản mẫu, dịch vụ làm thủ công hoặc buổi dùng thử.',
'Thống nhất trước thế nào là tín hiệu hữu ích: dùng lại, đặt mua hoặc tiết kiệm được một khoảng thời gian.',
'Hãy nói rõ đây là thử nghiệm và cam kết đúng những gì mình có thể thực hiện.'],
'Làm phiên bản nhỏ giúp anh biết có nên làm tiếp không.',
'Trước khi xây hệ thống đặt lịch phức tạp, có thể thử phục vụ vài khách bằng một quy trình đơn giản rồi đo thời gian và phản hồi.',
'Trong Xưởng dự án, tạo một dự án và viết thử nghiệm đầu tiên có thể làm được.',
'Mục tiêu chính của bản thử nghiệm là gì?',
['Có mọi tính năng','Kiểm chứng một giả định quan trọng','Trông giống công ty lớn'],1,'Bản thử nghiệm giúp giảm điều chưa biết bằng phản hồi thật.'),
make('business-3','business','Khi nào nên mở rộng?','Đọc bằng chứng trước khi tăng quy mô.',[
'Khách quay lại, lợi nhuận trên đơn và khả năng giao hàng ổn định là những dữ liệu đáng xem khi cân nhắc mở rộng.',
'Tăng số lượng có thể làm lộ ra giới hạn về tiền, nhân sự và chất lượng. Lập phương án cho cả tình huống nhu cầu thấp hơn dự kiến.',
'Quy mô tăng không tự động làm mô hình tốt hơn. Hãy xác định điều kiện cần có và điểm dừng trước khi cam kết thêm nguồn lực.'],
'Biết một việc vận hành ổn rồi mới thử làm nó lớn hơn, từng bước có kiểm tra.',
'Nếu mỗi đơn còn lỗ, bán thêm có thể làm tổng lỗ tăng. Cần hiểu nguyên nhân và cơ chế cải thiện trước khi mở rộng.',
'Ghi ba dấu hiệu cần đạt trước khi dự án của anh được phép mở rộng.',
'Thêm khách vào một mô hình đang lỗ trên từng đơn có thể làm gì?',
['Chắc chắn hết lỗ','Có thể tăng tổng lỗ','Tự động có lợi nhuận'],1,'Nếu phần lỗ trên mỗi đơn không thay đổi, nhiều đơn hơn làm lỗ tăng.'),
make('leadership-1','leadership','Lắng nghe để hiểu','Kiểm tra xem mình nghe đúng chưa.',[
'Lắng nghe gồm chú ý đến nội dung, hỏi làm rõ và kiểm tra cách mình hiểu. Tránh vội đoán động cơ của người khác.',
'Tóm tắt bằng một câu rồi hỏi "tôi hiểu như vậy có đúng không?". Phân biệt nhu cầu của họ với giải pháp họ đang đề nghị.',

make('decisions-1','decisions','Chi phí cơ hội','Mỗi lựa chọn dùng nguồn lực hữu hạn.',[

make('life-1','life','Thành công có ý nghĩa gì?','Tự xác định điều mình coi trọng.',[

make('life-2','life','Thiết kế một nhịp sống bền','Chọn việc nhỏ có thể duy trì.',[

make('life-3','life','Tài sản và trách nhiệm','Xem ai chịu tác động từ quyết định.',[

[{en:'demand',vi:'cầu (nhu cầu)',example:'Demand describes how much buyers want to buy.'},{en:'supply',vi:'cung',example:'Supply describes how much sellers are willing to offer.'},{en:'equilibrium price',vi:'giá cân bằng',example:'The equilibrium price tends to rise.'},{en:'inventory',vi:'tồn kho',example:'Reality is affected by inventory and competition.'}]),
'world-2':mk('Inflation and purchasing power','The same amount of money can buy less.',
['Inflation is a rise in the general price level over time. One item\'s price rising alone isn\'t enough to conclude there is overall inflation.',
'Purchasing power is the amount of goods and services money can buy. If your income grows slower than the price of what you buy, your purchasing power can fall.',
'When reading a statistic, check the country, time period, measurement method, and source.'],
"If your usual basket of goods gets more expensive while your money doesn't increase to match, you can buy less.",
"Hypothetical example: a basket of goods goes from 100,000 to 105,000 VND. That basket's price rose 5%; one person's basket doesn't represent the whole economy.",
'Write down three common expenses. What data would you need to compare them over time?',
'Is one food item getting more expensive enough to prove the national inflation rate?',
['Yes','No, you need a price index with the right scope','Yes, if that item is popular'],
'Overall inflation is measured across a range of goods and services, not from one single item.',
[{en:'inflation',vi:'lạm phát',example:'Inflation is a rise in the general price level.'},{en:'purchasing power',vi:'sức mua',example:'Purchasing power can fall if income grows slower than prices.'},{en:'price index',vi:'chỉ số giá',example:'You need a price index with the right scope.'},{en:'basket of goods',vi:'giỏ hàng hóa',example:'A basket of goods got more expensive.'}]),
'world-3':mk('Looking at a value chain','Find the links behind a product.',
['A product usually passes through many activities: raw materials, production, transport, distribution, and after-sales service.',
"At each link, ask who the customer is, where the biggest costs are, and what's being delayed or wasted.",
"An opportunity might lie in helping one link work better. A large industry size alone doesn't prove that opportunity fits you."],
'Trace a product from start to the user. Find which stretch is having trouble.',
'An item can sell slowly because of late delivery or a confusing description. Those two problems need different solutions.',
"Draw, in words, five steps that bring a familiar product to a customer. Pick one step that needs more research.",
'Is knowing an industry is very large enough to decide to enter it?',
["Yes, that's enough",'No, you still need to understand specific demand and reach','You just need a logo'],
'A large market is background information. Customers, competition, and execution capability still need to be verified.',
[{en:'value chain',vi:'chuỗi giá trị',example:'A product passes through a value chain.'},{en:'distribution',vi:'phân phối',example:'The value chain includes distribution.'},{en:'bottleneck',vi:'điểm nghẽn',example:'Find which link is a bottleneck.'},{en:'reach',vi:'khả năng tiếp cận',example:'You need to understand demand and reach.'}]),
'technology-1':mk('How does technology create value?','Start from the job that needs to get done.',
['Technology is a tool or method that helps you do something. The benefit can be less time, fewer errors, or making possible something that used to be hard.',
'Evaluate a tool by the outcome before and after using it, including the cost of setup and the time it takes to learn.',
'A new tool only matters for your goal when it solves a specific need.'],
'Ask "which way of working would be better?" then measure it, before deciding to use it widely.',
'Example: a form template cuts order-entry time from 4 minutes to 2 minutes. You still need to check errors and maintenance effort.',
'Pick a repetitive task. Write down the current time it takes and how you\'ll measure an improvement.',
"What's the most useful measure for an order-entry tool?",
['A modern-sounding name','Time, errors, and cost before/after','The number of nice-looking effects'],
'Measuring the outcome helps you evaluate the real benefit of a tool.',
[{en:'tool',vi:'công cụ',example:'Technology is a tool that helps you do something.'},{en:'efficiency',vi:'hiệu quả',example:'Evaluate a tool by the outcome.'},{en:'measure',vi:'đo lường',example:'Measure it before deciding to use it widely.'},{en:'maintenance',vi:'bảo trì',example:'Check the maintenance effort.'}]),
'technology-2':mk('Where can AI be wrong?','Use AI together with the ability to verify.',
["Generative AI can write fluent answers that contain wrong information or sources that don't exist. Confident wording doesn't prove correctness.",
"For important information, open the original source, check the date, and cross-check with independent evidence. Avoid feeding sensitive data into a service you don't fully understand.",
'Decisions with big consequences need a proper review process and people with the right expertise.'],
'Treat AI as an assistant for drafting and analysis. Verify anything important before acting on it.',
"If AI cites a regulation, look for the official, still-valid document. Don't use a single AI answer as your only evidence.",
"Write down one task you'd like AI to help with, and one step to verify the result before using it.",
'What does a very confident AI answer mean?',
["It's definitely correct",'It still needs verification for important information','You never need a source'],
"Fluency and confidence don't guarantee accuracy.",
[{en:'verify',vi:'kiểm chứng',example:'Verify anything important before using it.'},{en:'source',vi:'nguồn (thông tin)',example:'Look for the official, valid source.'},{en:'generative AI',vi:'AI tạo sinh',example:'Generative AI can write fluent but wrong answers.'},{en:'independent evidence',vi:'bằng chứng độc lập',example:'Cross-check with independent evidence.'}]),
'technology-3':mk('Testing a hypothesis','Ask a question that can be checked.',
["A hypothesis is a claim that can be compared against observation. Write down your prediction and how you'll measure it before you test.",
'When comparing two options, try to keep the relevant conditions equal. Changing too many things at once makes it hard to know what caused the result.',
'A small test gives limited evidence. Record the sample size, the time period, and any confounding factors.'],
'Write "if I do X, how will metric Y change," then go measure it.',
'Comparing two ways of introducing a product at the same price and with similar customer groups is easier to interpret than changing the price, the product, and the channel all at once.',
'Write a small experiment with a hypothesis, a metric, and a review date.',
'What problem does changing many factors at once cause?',
["It's hard to know which factor caused the result",'It always makes for a better experiment','It has no effect at all'],
'Factors that change together can make conclusions about cause less certain.',
[{en:'hypothesis',vi:'giả thuyết',example:'A hypothesis can be compared against observation.'},{en:'metric',vi:'chỉ số / thước đo',example:'How will the metric change?'},{en:'confounding factor',vi:'yếu tố gây nhiễu',example:'Record any confounding factors.'},{en:'sample size',vi:'cỡ mẫu',example:'Record the sample size and time period.'}]),
'business-1':mk('Starting from a problem','Meet someone in need before building a solution.',
["Describe the customer with a specific context: what they're doing, when they run into trouble, and what the consequences are.",
'Ask about the last time they had this problem and how they handled it. A real story is usually more useful than asking "do you like my idea?"',
'Record their exact words, with their consent. Separate what they said from your own interpretation.'],
"Understand what someone needs before guessing what they'll buy.",
'"When was the last time you waited too long for a delivery?" is more specific than "Would you like better delivery?"',
'Write three questions to understand the problem of a customer group you want to serve.',
'Which question helps gather real experience?',
['Do you think my idea is great?','The last time this happened, what did you do?','Can you compliment my product?'],
'Asking about behavior that already happened reduces the chance of getting only agreeable answers.',
[{en:'customer',vi:'khách hàng',example:'Describe the customer with specific context.'},{en:'context',vi:'bối cảnh',example:'Describe the context they are in.'},{en:'consent',vi:'sự đồng ý',example:'Record their words with their consent.'},{en:'behavior',vi:'hành vi',example:'Ask about behavior that already happened.'}]),
'business-2':mk('The smallest solution to test','Pick one assumption to verify.',
['A test version should be just enough to answer one important question. It could be a prototype, a manual service, or a trial session.',
'Agree in advance on what counts as a useful signal: repeat use, a purchase, or time saved.',
'Be clear that this is a test, and commit only to what you can actually deliver.'],
'Making a small version helps you know whether to continue.',
'Before building a complex booking system, you could serve a few customers manually with a simple process and measure time and feedback.',
'In the Project Workshop, create a project and write the first test you can actually do.',
'What is the main goal of a test version?',
['Have every feature','Verify one important assumption','Look like a big company'],
'A test version helps reduce uncertainty using real feedback.',
[{en:'prototype',vi:'bản mẫu',example:'A test version could be a prototype.'},{en:'signal',vi:'tín hiệu',example:'Agree on what counts as a useful signal.'},{en:'commit',vi:'cam kết',example:'Commit only to what you can deliver.'},{en:'assumption',vi:'giả định',example:'Verify one important assumption.'}]),
'business-3':mk('When should you scale up?','Read the evidence before increasing scale.',
['Repeat customers, profit per order, and stable delivery capability are worth watching when considering scaling up.',
'Increasing volume can expose limits in money, staff, and quality. Plan for the scenario where demand is lower than expected, too.',
"More scale doesn't automatically make the model better. Define the conditions needed and a stopping point before committing more resources."],
'Know that something works well at a small scale, then try making it bigger, step by step, with checks along the way.',
'If every order is still losing money, selling more can increase total losses. You need to understand the cause and the fix before scaling.',
'Write three signs that need to be true before your project is allowed to scale up.',
'What can adding customers to a model that loses money per order do?',
['Definitely stop the losses','Possibly increase total losses','Automatically become profitable'],
"If the loss per order doesn't change, more orders make the total loss bigger.",
[{en:'scale up',vi:'mở rộng quy mô',example:'Read the evidence before scaling up.'},{en:'repeat customer',vi:'khách quay lại',example:'Repeat customers are worth watching.'},{en:'profit per order',vi:'lợi nhuận trên mỗi đơn',example:'Watch profit per order.'},{en:'stopping point',vi:'điểm dừng',example:'Define a stopping point before committing more.'}]),
'leadership-1':mk('Listening to understand','Check whether you heard correctly.',
['Listening includes paying attention to content, asking clarifying questions, and checking your own understanding. Avoid quickly guessing someone else\'s motive.',
'Summarize in one sentence, then ask "did I understand that correctly?" Separate their need from the solution they are proposing.',
'Keeping small commitments is part of building trust over time.'],
'After listening, repeat the main point back and let the other person correct you if you misunderstood.',
'"I understand you need an earlier schedule to arrange things for your family, is that right?" helps clarify a specific need.',
'Recall a difficult conversation. Write one clarifying question you could use.',
"When someone's meaning isn't clear, what should you do?",
['Guess their motive','Ask a clarifying question and confirm','Interrupt to state your conclusion'],
'Confirming reduces misunderstanding before making a decision.',
[{en:'listen',vi:'lắng nghe',example:'Listening includes asking clarifying questions.'},{en:'clarify',vi:'làm rõ',example:'Ask a clarifying question.'},{en:'trust',vi:'sự tin cậy',example:'Keeping commitments builds trust.'},{en:'motive',vi:'động cơ',example:"Avoid guessing someone else's motive."}]),
'leadership-2':mk('Assigning work clearly','Agree on outcome, authority, and checkpoints.',
['An assigned task needs an owner, a desired outcome, a deadline, and a standard for completion.',
'Be clear about what the person doing the work can decide on their own and when they need to check in. Check progress at appropriate milestones.',
'Feedback should be based on specific behavior and results, while also listening to the obstacles the person faced.'],
'Be clear about what outcome is needed, by when, and how much decision-making authority the receiver has.',
'"Find three suppliers, compare price and delivery time by Friday; don\'t place the order yet" is clearer than "help take care of the supply side."',
'Rewrite a task you need to assign using four parts: owner, outcome, deadline, decision authority.',
'What does assigning work well require clarifying?',
['Just the name of the task','Outcome, deadline, and authority','Just saying to hurry up'],
'That information helps the receiver know the goal and the scope of action.',
[{en:'assign',vi:'giao (việc)',example:'Assigning work well requires clarity.'},{en:'deadline',vi:'thời hạn',example:'Agree on a deadline.'},{en:'authority',vi:'quyền quyết định',example:'Clarify their decision authority.'},{en:'milestone',vi:'mốc kiểm tra',example:'Check progress at appropriate milestones.'}]),
'leadership-3':mk('Incentive mechanisms','What gets rewarded can shape behavior.',
['Metrics and rewards send a signal about what the organization values. If only quantity is rewarded, quality can get neglected.',
'When designing how to evaluate people, ask how someone could optimize the metric without achieving the real goal.',
'Combine feedback, results, and long-term impact; explain the criteria transparently to everyone involved.'],
'Ask: if everyone tried hard to hit this metric, would customers and the team actually be better off?',
'Rewarding only call volume can lead to many unhelpful calls. You also need to look at quality and appropriate outcomes.',
'Pick a hypothetical reward metric. Write one unintended behavior it could create.',
"Why shouldn't you look only at quantity?",
['Because quality and consequences can be overlooked','Because every metric is useless',"Because you don't need to measure results at all"],
'A single metric may not fully reflect the real goal.',
[{en:'incentive',vi:'động lực / cơ chế khuyến khích',example:'Incentives can shape behavior.'},{en:'metric',vi:'chỉ số',example:'What gets rewarded can shape behavior.'},{en:'unintended behavior',vi:'hành vi ngoài ý muốn',example:'A reward can create unintended behavior.'},{en:'transparent',vi:'minh bạch',example:'Explain criteria transparently.'}]),
'decisions-1':mk('Opportunity cost','Every choice uses limited resources.',
['Opportunity cost is the value of the best alternative given up when you choose something else.',
'Time, money, and attention are all limited. Compare choices using the same goal and time frame.',
"Information you already have and resources already spent aren't automatically reasons to continue. Look at the benefits and costs still ahead of you."],
"Spending an hour on this means you can't use that exact hour for something else.",
'Choosing an unnecessary meeting can cost the time to finish something more important.',
"Write one thing you plan to do this week and the best alternative you'll have to skip.",
'What is opportunity cost related to?',
['Only money already spent','The best alternative given up','Every unrelated choice'],
'Resources used for one choice are no longer available for the other option.',
[{en:'opportunity cost',vi:'chi phí cơ hội',example:'Opportunity cost is the best alternative given up.'},{en:'alternative',vi:'phương án thay thế',example:'Compare the best alternative.'},{en:'trade-off',vi:'sự đánh đổi',example:'Every choice involves a trade-off.'},{en:'resource',vi:'nguồn lực',example:'Time and money are limited resources.'}]),
'decisions-2':mk('Thinking in multiple scenarios','Prepare for uncertainty.',
['Predicting the future has error. Describe at least three scenarios: favorable, base case, and unfavorable, along with the assumptions that create them.',
"See how each scenario affects money, time, and the people involved. Don't treat a number you made up as a proven probability.",
'Identify the signals to watch and the steps you can adjust as new information appears.'],
'Ask both "what if it goes well?" and "what do I do if it doesn\'t go as expected?"',
'When testing a product, also calculate a lower-than-expected sales scenario and check if you have enough money to keep the test going.',
'Write three scenarios for a decision and one signal that would make you reconsider.',
'What should a self-assigned forecast number be called?',
['A certain result','An assumption that needs verifying','A fact that already happened'],
'Naming an assumption correctly helps you avoid mistaking it for evidence.',
[{en:'scenario',vi:'kịch bản',example:'Describe at least three scenarios.'},{en:'assumption',vi:'giả định',example:"Don't treat a number as a proven probability."},{en:'uncertainty',vi:'sự không chắc chắn',example:'Prepare for uncertainty.'},{en:'signal',vi:'tín hiệu',example:'Identify the signals to watch.'}]),
'decisions-3':mk('A decision journal','Learn from both the process and the outcome.',
['Before acting, save your choice, the evidence, the assumptions, and a review date. Write down what could make you change your mind.',
"Afterward, compare the result with your original expectation. A good result can be partly due to luck; a bad result doesn't fully prove every step of your thinking was wrong.",
'Find something specific to improve: a data source, a question, a way of testing, or a way of tracking.'],
'Write down what you think before you know the outcome, so you can learn honestly later.',
'Writing "I predict customers will return because of reason X; I will check in two weeks" gives the later review something to anchor to.',
"Create an entry in the Notebook: the decision, the reasoning, what's still uncertain, and a review date.",
'When should you record the reasons for a decision?',
['After knowing the outcome, to make it sound good','Before knowing the outcome',"There's no need to record it"],
"Writing it down beforehand helps prevent your memory from being edited to match what happened.",
[{en:'journal',vi:'nhật ký',example:'Keep a decision journal.'},{en:'expectation',vi:'kỳ vọng',example:'Compare the result with your expectation.'},{en:'luck',vi:'may mắn',example:'A good result can be partly due to luck.'},{en:'review date',vi:'ngày xem lại',example:'Save a review date.'}]),
'life-1':mk('What does success mean?','Define what you value for yourself.',
['Goals can include wealth, health, family, freedom, and contribution. How much you prioritize each can differ from person to person.',
'Turn an abstract value into observable behavior: spending time with family, keeping your word, or choosing a project that helps others.',
'Revisit your goals as circumstances change. Your answer can mature along with your experience.'],
'Write down what you want to have and how you want to live once you have it.',
'If you value family, you might block out time to be present with loved ones on your own calendar.',
'Write three things you want to preserve on your journey of building wealth.',
'When does a personal value become more real?',
["When it's tied to specific behavior","When it's just a slogan",'When someone else chooses it for you'],
'Behavior helps you see whether that value truly shows up in your life.',
[{en:'value (n.)',vi:'giá trị (điều coi trọng)',example:'Define what you value for yourself.'},{en:'contribution',vi:'sự đóng góp',example:'Goals can include contribution.'},{en:'priority',vi:'ưu tiên',example:'How much you prioritize each can differ.'},{en:'behavior',vi:'hành vi',example:'Turn a value into observable behavior.'}]),
'life-2':mk('Designing a sustainable rhythm','Choose small things you can sustain.',
['A big goal needs to be broken into actions that fit into real life. Pick one small step, a time to do it, and a way to review it.',
'Watch your energy level, workload, and rest time. Adjust the rhythm instead of judging yourself only by how much you got done.',
'When you miss a day, identify the obstacle and choose the next appropriate step.'],
'Build a manageable schedule, then improve it through experience.',
'Reading one lesson, writing two sentences applying it, and trying one thing is a study session with a clear result.',
"Choose a time block you can dedicate to studying and write the small action you'll take.",
'When a study schedule is too heavy and keeps getting missed, what should you do?',
['Double it immediately','Look at the obstacle and adjust to a manageable level',"Conclude that you can't study"],
'A rhythm that fits your circumstances gives you a real chance to keep going and learn from reality.',
[{en:'sustainable',vi:'bền vững',example:'Design a sustainable rhythm.'},{en:'workload',vi:'khối lượng công việc',example:'Watch your workload.'},{en:'obstacle',vi:'trở ngại',example:'Identify the obstacle.'},{en:'adjust',vi:'điều chỉnh',example:'Adjust the rhythm as needed.'}]),
'life-3':mk('Wealth and responsibility','See who is affected by a decision.',
['Business and financial decisions can affect customers, employees, family, and the community.',
'When weighing benefits, also record who bears the costs or risks. Look at their rights, promises made to them, and how they respond.',
'A legacy can be built from how you work every day: the skills you pass on, the opportunities you create, and the organizations you help grow.'],
'Ask: who does this help, who could it make things harder for, and how should I be responsible?',
'Choosing a cheaper supplier also requires looking at quality, working conditions, and commitments to customers.',
'Pick a business idea. Write three groups of people affected and one thing you need to learn from them.',
'What does evaluating a responsible decision require looking at?',
['Only your own benefit','Benefits, costs, and who is affected','Only outward appearance'],
'Looking at who is affected makes a decision more complete and responsible.',
[{en:'responsibility',vi:'trách nhiệm',example:'See who is affected by a decision.'},{en:'legacy',vi:'di sản',example:'A legacy can be built from daily work.'},{en:'stakeholder',vi:'bên liên quan',example:'Consider every stakeholder.'},{en:'community',vi:'cộng đồng',example:'Decisions can affect the community.'}])
};

const caseStudies=[
{id:'case-amazon',domain:'business',title:'Nghiên cứu tình huống: Amazon',title_en:'Case study: Amazon',
summary:'Từ một hiệu sách trực tuyến đến nhiều mảng kinh doanh khác nhau.',summary_en:'From an online bookstore to many different businesses.',
paragraphs:['Amazon được Jeff Bezos thành lập năm 1994, ban đầu là một hiệu sách trực tuyến. Đây là sự kiện được ghi nhận rộng rãi, không phải suy đoán.',
'Theo thời gian, Amazon mở rộng sang nhiều lĩnh vực bán lẻ khác và sau đó xây dựng Amazon Web Services (AWS) — mảng kinh doanh dịch vụ điện toán đám mây. Đây cũng là các sự kiện đã được công bố rộng rãi.',
'Bài học không đi vào số liệu tài chính cụ thể của Amazon vì chưa được kiểm chứng trong tài liệu này. Phần thực hành dưới đây dùng số liệu giả định để anh tập phân tích, không phải số liệu thật của công ty.'],
paragraphs_en:['Amazon was founded by Jeff Bezos in 1994, originally as an online bookstore. This is a widely documented fact, not speculation.',
'Over time, Amazon expanded into many other retail categories and later built Amazon Web Services (AWS), its cloud-computing business. These are also widely published facts.',
"This lesson does not go into Amazon's specific financial figures, since they haven't been verified in this material. The practice exercise below uses made-up numbers for you to practice analysis, not the company's real figures."],
simple:'Amazon bắt đầu nhỏ (bán sách), rồi mở rộng dần sang những lĩnh vực khác khi đã có nền tảng khách hàng và hạ tầng.',
simple_en:'Amazon started small (selling books), then gradually expanded into other areas once it had a customer base and infrastructure.',
example:'Bài tập mô phỏng (số liệu giả định): giả sử một cửa hàng online có 1.000 khách/tháng, mở rộng thêm một ngành hàng mới. Anh thử ước tính chi phí và rủi ro của việc mở rộng này.',
example_en:'Simulated exercise (made-up numbers): suppose an online store has 1,000 customers/month and expands into a new product category. Try estimating the cost and risk of that expansion.',
task:'Viết một ví dụ (thật hoặc giả định) về một doanh nghiệp bắt đầu nhỏ rồi mở rộng dần. Chỉ ra bước mở rộng nào đã tận dụng được nền tảng có sẵn.',
task_en:'Write an example (real or hypothetical) of a business that started small and gradually expanded. Point out which expansion step made use of an existing foundation.',
question:'Việc Amazon mở rộng từ bán sách sang nhiều lĩnh vực khác cho thấy điều gì về cách mở rộng kinh doanh?',
question_en:"What does Amazon's expansion from books into many other areas show about how businesses scale?",
options:['Chỉ cần đổi tên công ty là mở rộng được','Mở rộng có thể tận dụng nền tảng khách hàng/hạ tầng đã có','Mọi công ty nên mở rộng ngay từ ngày đầu'],
options_en:['Just renaming the company counts as expanding','Expansion can make use of an existing customer base/infrastructure','Every company should expand from day one'],
correct:1,
explanation:'Mở rộng thường hiệu quả hơn khi tận dụng được nền tảng (khách hàng, hạ tầng, uy tín) đã xây dựng, thay vì bắt đầu lại từ số 0 ở mỗi lĩnh vực mới.',
explanation_en:'Expansion is often more effective when it builds on an existing foundation (customers, infrastructure, reputation) rather than starting from zero in every new area.',
sourceNote:'Thông tin công khai, được biết đến rộng rãi về lịch sử thành lập và mở rộng của Amazon. Bản port này chưa trích dẫn tài liệu nguồn cụ thể (10-K, báo chí) — anh nên tự kiểm chứng thêm nếu cần độ chính xác cao. Phần ví dụ/bài tập dùng số liệu giả định, không phải số liệu tài chính thật.'},
{id:'case-berkshire',domain:'business',title:'Nghiên cứu tình huống: Berkshire Hathaway',title_en:'Case study: Berkshire Hathaway',
summary:'Đầu tư theo triết lý giá trị, nhìn dài hạn.',summary_en:'Value-investing philosophy, thinking long-term.',

function lessonContent(l){
 const en = lessonsEN[l.id] || {title:l.title_en,summary:l.summary_en,paragraphs:l.paragraphs_en,simple:l.simple_en,example:l.example_en,task:l.task_en,question:l.question_en,options:l.options_en,explanation:l.explanation_en,vocab:l.vocab||[]};
 return {
  vi:{title:l.title,summary:l.summary,paragraphs:l.paragraphs,simple:l.simple,example:l.example,task:l.task,question:l.question,options:l.options,explanation:l.explanation},
  en:en||null, vocab:(en&&en.vocab)||[], sourceNote:l.sourceNote||''
 };
}
/* Câu tiếng Anh dùng để luyện nghe/luyện viết của một bài */

}

function breadthEvidence(state){
 return domains.map(domain=>{
  const ids=state.completions.filter(c=>c.lesson_id.startsWith(domain.id+'-')).map(c=>c.lesson_id);
  const revs=state.reviewEvents.filter(r=>r.lesson_id.startsWith(domain.id+'-'));
  const applied=state.commitments.filter(c=>c.plan.sourceLessonId && c.plan.sourceLessonId.startsWith(domain.id+'-') && c.resolution);

 });

 * Giọng đọc phụ thuộc hoàn toàn vào giọng có sẵn trên thiết bị (iPadOS/Safari).
 * App ưu tiên giọng en-US, nhưng nếu máy không có thì hiển thị đúng những gì đang có. */
const Speech={
 supported: typeof window!=='undefined' && 'speechSynthesis' in window,
 voices:[], voiceURI:null, rate:1, queue:[], playing:false, currentIndex:-1, onTick:null,
 init(){
  if(!this.supported) return;
  const load=()=>{
   const all=window.speechSynthesis.getVoices()||[];
   this.voices=all.filter(v=>String(v.lang||'').toLowerCase().indexOf('en')===0);
   if(!this.voiceURI && this.voices.length){
    const us=this.voices.filter(v=>/en[-_]US/i.test(v.lang));
    // Ưu tiên giọng Anh-Mỹ chất lượng cao nếu máy có (Samantha/Ava/Allison trên iPadOS)
    const nice=us.find(v=>/samantha|ava|allison|nicky|aaron|enhanced|premium/i.test(v.name));
    this.voiceURI=(nice||us[0]||this.voices[0]).voiceURI;
   }
   if(this.onVoicesChanged) this.onVoicesChanged();
  };
  load();
  try{ window.speechSynthesis.onvoiceschanged=load; }catch(e){}
 },
 pickVoice(){ return this.voices.find(v=>v.voiceURI===this.voiceURI)||this.voices[0]||null; },
 stop(){ this.queue=[]; this.playing=false; this.currentIndex=-1; if(this.supported) window.speechSynthesis.cancel(); if(this.onTick) this.onTick(); },
 speakOne(text,rate){
  if(!this.supported) return false;
  this.stop();
  const u=new SpeechSynthesisUtterance(text); u.lang='en-US'; u.rate=rate||this.rate;
  const v=this.pickVoice(); if(v){ u.voice=v; u.lang=v.lang; }
  window.speechSynthesis.speak(u); return true;
 },
 speakList(sentences,rate,onTick){
  if(!this.supported) return false;
  this.stop(); this.queue=sentences.slice(); this.onTick=onTick; this.playing=true; this.currentIndex=-1;
  const next=()=>{
   if(!this.playing) return;
   this.currentIndex++;
   if(this.currentIndex>=this.queue.length){ this.playing=false; this.currentIndex=-1; if(this.onTick) this.onTick(); return; }
   if(this.onTick) this.onTick();
   const u=new SpeechSynthesisUtterance(this.queue[this.currentIndex]); u.lang='en-US'; u.rate=rate||this.rate;
   const v=this.pickVoice(); if(v){ u.voice=v; u.lang=v.lang; }
   u.onend=next;
   u.onerror=()=>{ this.playing=false; this.currentIndex=-1; if(this.onTick) this.onTick(); };
   window.speechSynthesis.speak(u);
  };
  next(); return true;
 },
 pause(){ if(this.supported && window.speechSynthesis.speaking) window.speechSynthesis.pause(); },
 resume(){ if(this.supported) window.speechSynthesis.resume(); }
};

 return String(text||'').split(/(?<=[.!?])\s+/).map(s=>s.trim()).filter(Boolean);

/* ---------------- growth / stats helpers ---------------- */
function dueReviews(state,now){ now=now||vnNow(); return state.reviews.filter(r=>new Date(r.due).getTime()<=now.getTime()).sort((a,b)=>a.due.localeCompare(b.due)); }
function brierScore(p,outcome){ return Math.pow(p/100-(outcome==='yes'?1:0),2); }
function forecastStats(items){ const scores=items.filter(c=>c.kind==='forecast'&&c.resolution&&c.resolution.outcome!=='unresolved').map(c=>brierScore(c.plan.probability,c.resolution.outcome)); return {count:scores.length,score:scores.length?scores.reduce((s,x)=>s+x,0)/scores.length:null}; }
function experimentPassed(plan,result){ if(result.outcome!=='measured'||result.observed===null) return null; return plan.comparator==='at-least'?result.observed>=plan.threshold:result.observed<=plan.threshold; }
function learningStats(state,now){ now=now||vnNow(); const since=now.getTime()-30*86400000; const events=state.reviewEvents.filter(e=>{const t=new Date(e.reviewed_at).getTime();return t>=since&&t<=now.getTime();}); return {attempts:events.length,correct:events.filter(e=>e.correct===1).length,lessons:new Set(events.map(e=>e.lesson_id)).size}; }

/* Simplified spaced-repetition scheduler (không dùng ts-fsrs, cùng tinh thần) */
const INTERVALS=[1,2,4,8,16,30,60,90];
function initialCard(completedAt){ return {due:new Date(new Date(completedAt).getTime()+86400000).toISOString(),revision:0}; }
function advanceCard(card,correct,now){
 const rev = correct ? Math.min(card.revision+1, INTERVALS.length-1) : Math.max(0, card.revision-1);
 const days = INTERVALS[rev];
 return {due:new Date(now.getTime()+days*86400000).toISOString(),revision:rev};
}

function projectSavings(initial,monthly,annualPercent,years){
 if(![initial,monthly,annualPercent,years].every(Number.isFinite)||initial<0||monthly<0||annualPercent<=-100||years<1||years>50) throw new Error('Thông số mô phỏng không hợp lệ.');
 const monthlyRate=Math.pow(1+annualPercent/100,1/12)-1; let value=initial; const points=[initial];
 for(let i=1;i<=years*12;i++){ value=value*(1+monthlyRate)+monthly; if(i%12===0) points.push(value); }
 return {value,contributions:initial+monthly*years*12,points};
}

/* Không có màn đăng nhập — anh học một mình. Dữ liệu lưu ngay vào máy (localStorage),
 * và nếu đã điền SUPABASE_URL/KEY ở trên thì đồng bộ ngầm qua một phiên ẩn danh
 * (sb.auth.signInAnonymously) để có thể sao lưu/khôi phục giữa các thiết bị sau này. */
const S = { session:null, data:emptyState(), view:'today', loading:true, error:'', syncStatus: SUPABASE_CONFIGURED?'connecting':'local-only',
 selectedLesson:null, review:null, editor:null, deletion:null, growthEditor:null, resolving:null, growthDeletion:null, profileOpen:false, helpOpen:false, toast:null,
 lang:'vi', studyMode:'word', inkDraft:null, entryTest:null, restoreFile:null };
let saveTimer=null;

function toast(msg){ S.toast=msg; render(); setTimeout(()=>{ if(S.toast===msg){S.toast=null; render();} },2800); }

function readLocalCache(){
 try{ const raw=localStorage.getItem(LOCAL_KEY); if(!raw) return null; return JSON.parse(raw); }catch(e){ return null; }
}
function writeLocalCache(data){
 try{ localStorage.setItem(LOCAL_KEY, JSON.stringify({data,updated_at:new Date().toISOString()})); }catch(e){ /* iPad private mode / hết chỗ: bỏ qua, vẫn giữ trong bộ nhớ phiên hiện tại */ }
}

async function loadState(){
 S.loading=true; render();
 const local=readLocalCache();
 S.data = local && local.data && Object.keys(local.data).length ? Object.assign(emptyState(), local.data) : emptyState();
 S.loading=false; S.error='';
 if(!SUPABASE_CONFIGURED){ S.syncStatus='local-only'; render(); return; }
 render();
 try{
  const {data:sess} = await sb.auth.getSession();
  let session = sess.session;
  if(!session){ const {data,error} = await sb.auth.signInAnonymously(); if(error) throw error; session=data.session; }
  S.session=session;
  const {data,error} = await sb.from('atlas_state').select('data,updated_at').eq('user_id',session.user.id).maybeSingle();
  if(error) throw error;
  if(data && data.data && Object.keys(data.data).length){
   const remoteTime = new Date(data.updated_at).getTime();
   const localTime = local ? new Date(local.updated_at).getTime() : 0;
   if(!local || remoteTime > localTime){ S.data = Object.assign(emptyState(), data.data); writeLocalCache(S.data); }
  }
  S.syncStatus='synced'; render();
 }catch(e){ S.syncStatus='local-only'; render(); }
}
function scheduleSave(){
 writeLocalCache(S.data);
 if(!SUPABASE_CONFIGURED || !S.session){ S.syncStatus='local-only'; return; }
 S.syncStatus='syncing'; render();
 clearTimeout(saveTimer);
 saveTimer=setTimeout(saveNow, 700);
}
async function saveNow(){
 if(!S.session) return;
 try{
  const {error} = await sb.from('atlas_state').upsert({user_id:S.session.user.id, data:S.data, updated_at:new Date().toISOString()});
  if(error) throw error;
  S.syncStatus='synced';
 }catch(e){ S.syncStatus='sync-error'; }
 render();
}
function mutate(fn){ fn(S.data); scheduleSave(); render(); }

/* ================= actions ================= */
function completeLesson(lessonId,answer,reflection,selfRating){
 const now=vnNow().toISOString();
 mutate(d=>{
  const idx=d.completions.findIndex(c=>c.lesson_id===lessonId);
  if(idx>=0){ d.completions[idx].reflection=reflection; if(selfRating) d.completions[idx].self_explain=selfRating; }
  else d.completions.push({lesson_id:lessonId,reflection,completed_at:now,self_explain:selfRating||null});
  if(reviewQuestions[lessonId] && !d.reviews.some(r=>r.lesson_id===lessonId)) d.reviews.push({lesson_id:lessonId,...initialCard(now)});
 });
 toast('Đã lưu bài học và ghi chép.');
}
function submitReview(card,answer){
 const q=reviewQuestions[card.lesson_id]; const correct=answer===q.correct; const now=vnNow();
 mutate(d=>{
  d.reviewEvents.unshift({id:uid(),lesson_id:card.lesson_id,revision:card.revision,answer,correct:correct?1:0,reviewed_at:now.toISOString(),practice:card.practiceOnly?1:0});
  // Luyện thêm từ Sổ lỗi KHÔNG làm thay đổi lịch ôn cách quãng
  if(card.practiceOnly) return;
  const next=advanceCard(card,correct,now);
  const r=d.reviews.find(r=>r.lesson_id===card.lesson_id);
  if(r){ r.due=next.due; r.revision=next.revision; }
 });
 return correct;
}
function saveRecord(kind,data,id){
 mutate(d=>{
  if(id){ const r=d.records.find(r=>r.id===id); if(r) r.data=data; }
  else d.records.unshift({id:uid(),kind,data,created_at:vnNow().toISOString()});
 });
 toast('Đã lưu lại cho anh.');
}
function deleteRecord(id){ mutate(d=>{ d.records=d.records.filter(r=>r.id!==id); }); toast('Đã xóa mục đã chọn.'); }
function saveProfile(profile){ mutate(d=>{ d.profile=profile; }); toast('Đã lưu hành trình của anh.'); }

 * Đây là bản sao lưu DỮ LIỆU HỌC của anh (tiến độ, ghi chép, dự án…),
 * KHÁC với tệp mã nguồn app (index.html). Khôi phục luôn hỏi xác nhận, không ghi đè âm thầm. */
const BACKUP_FORMAT='atlas-export', BACKUP_VERSION=2;
function validateBackup(obj){
 if(!obj || typeof obj!=='object') return {ok:false,error:'Tệp không phải JSON hợp lệ.'};
 if(obj.format!==BACKUP_FORMAT) return {ok:false,error:'Tệp này không phải bản sao lưu ATLAS (thiếu dấu hiệu "format": "atlas-export"). Có thể anh chọn nhầm tệp mã nguồn app.'};
 if(typeof obj.version!=='number' || obj.version>BACKUP_VERSION) return {ok:false,error:'Phiên bản dữ liệu ('+obj.version+') mới hơn phiên bản app đang chạy ('+BACKUP_VERSION+'). Anh cập nhật app trước khi khôi phục nhé.'};
 if(!Array.isArray(obj.completions)||!Array.isArray(obj.records)) return {ok:false,error:'Tệp thiếu dữ liệu bắt buộc (completions/records).'};
 return {ok:true};
}

/* ================= ĐÁNH GIÁ ĐẦU VÀO =================

   : {text:'Nền tảng khá tốt. Anh có thể vào thẳng phần kinh doanh và quyết định, dùng phần còn lại để ôn.',lesson:lessons.find(l=>l.id==='business-1')};

 <div class="btn-row"><button class="btn" data-act="entrynext" ${t.answer===null||t.answer===undefined?'disabled':''}>${i===ENTRY_IDS.length-1?'Xem kết quả':'Câu tiếp theo'}</button>

/* ================= PHIÊN HỌC HẰNG NGÀY =================
 * Ghép việc theo quỹ thời gian đã lưu trong hồ sơ: ôn bài đến hạn → học bài mới → nghe → viết. */
function buildDailySession(){
 const d=S.data, budget=d.profile.minutes||15;
 const due=dueReviews(d), done=new Set(d.completions.map(c=>c.lesson_id));
 const next=learningOrder.find(l=>!done.has(l.id));
 const lastDone=[...d.completions].reverse()[0];
 const items=[];
 const reviewCount = budget>=60?4:budget>=30?3:2;
 due.slice(0,reviewCount).forEach(r=>items.push({type:'review',id:r.lesson_id,label:'Ôn: '+allLessons.find(l=>l.id===r.lesson_id).title,minutes:2}));
 if(next) items.push({type:'lesson',id:next.id,label:'Học bài mới: '+next.title,minutes:budget>=60?15:budget>=30?10:5});
 const listenLesson = next || (lastDone?allLessons.find(l=>l.id===lastDone.lesson_id):learningOrder[0]);
 if(listenLesson) items.push({type:'listen',id:listenLesson.id,label:'Nghe tiếng Anh: '+listenLesson.title,minutes:budget>=30?5:3});
 if(listenLesson) items.push({type:'write',id:listenLesson.id,label:'Luyện viết câu từ bài: '+listenLesson.title,minutes:budget>=60?15:budget>=30?8:5});
 if(budget>=30 && listenLesson) items.push({type:'explain',id:listenLesson.id,label:'Tự giải thích lại bài bằng lời của anh',minutes:5});
 return items;
}
function todaySession(){
 const d=S.data, today=localDay();
 if(!d.dailySession || d.dailySession.date!==today){
  return {date:today, items:buildDailySession().map(x=>({...x,done:false}))};
 }
 return d.dailySession;
}
function renderSessionPanel(){
 const s=todaySession();
 const doneCount=s.items.filter(i=>i.done).length;
 const total=s.items.reduce((sum,i)=>sum+i.minutes,0);
 return `<section class="panel">
 <div class="card-header"><h2>Phiên học hôm nay</h2><span class="muted">${doneCount}/${s.items.length} việc · ~${total} phút</span></div>
 <p class="reference-note">Ghép theo quỹ thời gian ${S.data.profile.minutes} phút/ngày anh đã đặt trong hồ sơ. Đánh dấu xong để theo dõi; danh sách tự làm mới mỗi ngày.</p>
 ${s.items.map((it,i)=>`<div class="session-item ${it.done?'done':''}">
  <input type="checkbox" style="width:auto" ${it.done?'checked':''} data-act="sessiondone" data-i="${i}">
  <span style="flex:1">${esc(it.label)}<br><small class="muted">~${it.minutes} phút</small></span>
  <button class="btn outline" data-act="sessionopen" data-i="${i}">Mở</button>
 </div>`).join('')}
 ${!s.items.length?`<p class="muted">Hôm nay chưa có việc nào được ghép. Anh hoàn thành một bài học để em bắt đầu xếp lịch nhé.</p>`:''}
 </section>`;
}

/* ================= SỔ LỖI ================= */
function mistakeList(){
 const d=S.data, byLesson={};
 (d.reviewEvents||[]).forEach(e=>{
  if(e.correct===1) return;
  byLesson[e.lesson_id]=byLesson[e.lesson_id]||{lesson_id:e.lesson_id,count:0,last:e.reviewed_at};
  byLesson[e.lesson_id].count++;
  if(e.reviewed_at>byLesson[e.lesson_id].last) byLesson[e.lesson_id].last=e.reviewed_at;
 });
 (d.writingEvents||[]).forEach(e=>{
  if(e.ok===1||!e.lesson_id) return;
  byLesson[e.lesson_id]=byLesson[e.lesson_id]||{lesson_id:e.lesson_id,count:0,last:e.at,writing:0};
  byLesson[e.lesson_id].writing=(byLesson[e.lesson_id].writing||0)+1;
 });
 return Object.values(byLesson).sort((a,b)=>b.count-a.count);
}
function renderMistakes(){
 const list=mistakeList();
 if(!list.length) return `<div class="empty-panel"><h2>Chưa có lỗi nào được ghi</h2><p class="muted">Khi anh trả lời sai một câu ôn hoặc viết sai một câu luyện tập, nó sẽ xuất hiện ở đây để luyện lại.</p></div>`;
 return `<p class="section-intro muted">Những bài anh từng trả lời sai hoặc viết chưa đúng. Luyện lại ở đây <b>không ảnh hưởng lịch ôn cách quãng</b> — chỉ là luyện thêm.</p>
 ${list.map(m=>{
  const l=allLessons.find(x=>x.id===m.lesson_id); if(!l) return '';
  return `<div class="lesson-row"><span class="lesson-num">${m.count}</span><span>${esc(l.title)}<small>${m.count} lần sai câu ôn${m.writing?` · ${m.writing} lần viết chưa đúng`:''} · gần nhất ${displayDate(m.last)}</small></span>
  <button class="btn outline" data-act="practicemistake" data-id="${l.id}">Luyện lại</button>
  <button class="btn ghost" data-act="lesson" data-id="${l.id}">Đọc bài</button></div>`;
 }).join('')}`;
}

/* ================= BÀN HỌC: viết tay bằng Apple Pencil =================
 * Ba chế độ: luyện từ · luyện câu · viết tự do.
 * Luồng chấm bài bắt buộc: anh viết tay → gõ lại/đối chiếu văn bản → XÁC NHẬN → mới chấm.
 * Lưu ý trung thực: trình duyệt (Safari/iPadOS) hiện KHÔNG có API nhận dạng chữ viết tay
 * chạy trên máy mà app có thể dùng miễn phí và đáng tin cậy. Vì vậy app KHÔNG tạo ra
 * kết quả nhận dạng giả — bước "nhận dạng" được thay bằng việc anh tự gõ lại điều đã viết,
 * rồi xác nhận. Nếu sau này có API nhận dạng đáng tin, chỉ cần thay đúng bước này. */

function newInkDraft(mode,lessonId,targetIndex){
 return {mode,lessonId:lessonId||'',targetIndex:targetIndex||0,strokes:[],redo:[],color:INK_COLORS[0],width:3,

function openStudy(mode,lessonId,targetIndex){
 Speech.stop();

 S.inkDraft=newInkDraft(mode||'word',lessonId||'',targetIndex||0);

}
function inkKey(mode,lessonId,targetIndex){ return mode+':'+(lessonId||'free')+':'+(targetIndex||0); }

/* Mục tiêu luyện tập hiện tại (từ hoặc câu) */
function studyTargets(){
 const d=S.inkDraft; if(!d) return [];
 const lesson=allLessons.find(l=>l.id===d.lessonId);
 if(!lesson) return [];
 if(d.mode==='word'){ const c=lessonContent(lesson); return (c.vocab||[]).map(v=>({text:v.en,hint:v.vi,example:v.example})); }
 if(d.mode==='sentence'){ return englishSentences(lesson).map(s=>({text:s,hint:'',example:''})); }
 return [];
}
function currentTarget(){ const t=studyTargets(); return t[S.inkDraft?S.inkDraft.targetIndex:0]||null; }

/* So khớp văn bản đã xác nhận với câu mẫu: bỏ qua hoa/thường, khoảng trắng thừa và dấu câu cuối */
function normalizeAnswer(s){
 return String(s||'').toLowerCase().replace(/[.,!?;:"'’“”]/g,' ').replace(/\s+/g,' ').trim();
}
function gradeText(target,typed){
 const a=normalizeAnswer(target), b=normalizeAnswer(typed);
 if(!b) return {ok:false,score:0,diff:[],message:'Anh chưa nhập gì cả.'};
 if(a===b) return {ok:true,score:100,diff:[],message:''};
 const aw=a.split(' '), bw=b.split(' ');
 const wrong=[]; const max=Math.max(aw.length,bw.length);
 for(let i=0;i<max;i++){ if(aw[i]!==bw[i]) wrong.push({i,expected:aw[i]||'(thiếu từ)',got:bw[i]||'(thiếu từ)'}); }
 const right=max-wrong.length;
 return {ok:false,score:Math.round(right/max*100),diff:wrong,message:''};
}

function copyToClipboard(text,okMsg){
 const done=()=>{ S.inkDraft.copied=okMsg+' (Đây chỉ là sao chép — app chưa gửi gì sang Astra/ChatGPT.)'; render(); };
 if(navigator.clipboard && navigator.clipboard.writeText){
  navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text,done));
 } else fallbackCopy(text,done);
}
function fallbackCopy(text,done){
 try{
  const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); done();
 }catch(e){ toast('Chưa sao chép được. Anh bấm giữ vào ô văn bản để copy thủ công nhé.'); }
}

 });

/* ---- canvas: khởi tạo sau mỗi lần render view Bàn học ---- */
function inkRedraw(canvas,d){
 const ctx=canvas.getContext('2d');
 ctx.fillStyle='#fdfaf1'; ctx.fillRect(0,0,canvas.width,canvas.height);
 // dòng kẻ mờ cho dễ viết
 ctx.strokeStyle='#e6e0cc'; ctx.lineWidth=1;
 for(let y=60;y<canvas.height;y+=75){ ctx.beginPath(); ctx.moveTo(20,y); ctx.lineTo(canvas.width-20,y); ctx.stroke(); }
 d.strokes.forEach(s=>{
  ctx.strokeStyle=s.color; ctx.fillStyle=s.color; ctx.lineWidth=s.width; ctx.lineCap='round'; ctx.lineJoin='round';
  if(s.points.length===1){ ctx.beginPath(); ctx.arc(s.points[0][0],s.points[0][1],s.width/2,0,Math.PI*2); ctx.fill(); return; }
  ctx.beginPath(); ctx.moveTo(s.points[0][0],s.points[0][1]);
  for(let i=1;i<s.points.length;i++) ctx.lineTo(s.points[i][0],s.points[i][1]);
  ctx.stroke();
 });
}
function initInkCanvas(){
 const canvas=document.getElementById('inkCanvas'); if(!canvas || !S.inkDraft) return;
 const d=S.inkDraft;
 inkRedraw(canvas,d);
 let drawing=false, current=null;
 const pos=(e)=>{ const r=canvas.getBoundingClientRect(); return [ (e.clientX-r.left)*canvas.width/r.width, (e.clientY-r.top)*canvas.height/r.height ]; };
 canvas.addEventListener('pointerdown',e=>{
  e.preventDefault();
  try{ canvas.setPointerCapture(e.pointerId); }catch(err){}
  drawing=true; current={color:d.color,width:d.width,points:[pos(e)]};
  d.strokes.push(current); d.redo=[]; inkRedraw(canvas,d);
 });
 canvas.addEventListener('pointermove',e=>{ if(!drawing) return; e.preventDefault(); current.points.push(pos(e)); inkRedraw(canvas,d); });
 const end=()=>{ if(!drawing) return; drawing=false; current=null; };
 canvas.addEventListener('pointerup',end);
 canvas.addEventListener('pointercancel',end);
 canvas.addEventListener('pointerleave',end);
}
